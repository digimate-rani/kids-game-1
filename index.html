<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1f3b1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מירוץ הכביש">
<title>מירוץ הכביש</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0d150d;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';

// ---------- constants ----------
const W = 360;            // logical width; height follows the screen shape
const HALF = 120;         // half road width
const LANE = 60;          // 4 lanes
const PW = 26, PH = 46;   // player size
const ZONE = 30000;       // one world every 600 m
const KEY = 'kids-game-1.v1';

const CARS = [
  { name: 'ספורט',   style: 'sport', body: '#e63946', stripe: '#ffffff', price: 0 },
  { name: 'קופה',    style: 'coupe', body: '#2a7de1', stripe: '#ffd60a', price: 30 },
  { name: 'ג׳יפ',    style: 'jeep',  body: '#3f9b4f', stripe: '#1d3b22', price: 60 },
  { name: 'מונית',   style: 'taxi',  body: '#ffc300', stripe: '#1a1a1a', price: 100 },
  { name: 'פורמולה', style: 'f1',    body: '#8e44ad', stripe: '#ff9ff3', price: 150 },
  { name: 'זהב',     style: 'gold',  body: '#d4af37', stripe: '#fff6c7', price: 250 },
];
const TRAFFIC_COLORS = ['#4f5d75', '#c8cdd2', '#ef8354', '#4cc9f0', '#90be6d', '#f9844a', '#9d8189', '#577590', '#f28482'];
const BIG = { truck: [30, 80], bus: [30, 84], van: [28, 52] };

const BIOMES = [
  { kind: 'meadow', ground: '#4c9c45', band: 'rgba(255,255,255,.045)' },
  { kind: 'desert', ground: '#e0bb76', band: 'rgba(140,80,0,.06)' },
  { kind: 'snow',   ground: '#e6eef5', band: 'rgba(70,110,160,.06)' },
  { kind: 'night',  ground: '#3f8040', band: 'rgba(0,0,0,.05)' },
];

// ---------- canvas ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const SS = Math.min(6, Math.ceil((window.devicePixelRatio || 1) * 2.2)); // sprite resolution
let H = 640, scale = 1, dpr = 1, PLAYER_Y = 486;
const lightC = document.createElement('canvas'), lg = lightC.getContext('2d');
let vignette = null;

function resize() {
  const iw = window.innerWidth, ih = window.innerHeight;
  const cw = Math.min(iw, ih * 0.62), ch = ih;
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width = cw + 'px';
  cv.style.height = ch + 'px';
  cv.width = Math.round(cw * dpr);
  cv.height = Math.round(ch * dpr);
  scale = cw / W;
  H = ch / scale;
  PLAYER_Y = H * 0.76;
  lightC.width = Math.ceil(W / 2);
  lightC.height = Math.ceil(H / 2);
  vignette = document.createElement('canvas');
  vignette.width = W; vignette.height = Math.ceil(H);
  const vg = vignette.getContext('2d');
  const g = vg.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.72);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,.42)');
  vg.fillStyle = g; vg.fillRect(0, 0, W, H);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));
resize();

// ---------- save ----------
const save = { best: 0, coins: 0, owned: [0], car: 0, mute: false };
try { Object.assign(save, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }

// ---------- sound ----------
let ac = null, eng = null, engGain = null;
function audioInit() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    eng = ac.createOscillator();
    eng.type = 'sawtooth';
    engGain = ac.createGain();
    engGain.gain.value = 0;
    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 420;
    eng.connect(lp); lp.connect(engGain); engGain.connect(ac.destination);
    eng.start();
  } catch (e) { ac = null; }
}
function engineSet(on, spd) {
  if (!ac) return;
  engGain.gain.setTargetAtTime(on && !save.mute ? 0.045 : 0, ac.currentTime, 0.12);
  eng.frequency.setTargetAtTime(48 + spd * 0.13, ac.currentTime, 0.12);
}
function blip(f1, f2, dur, type, vol) {
  if (!ac || save.mute) return;
  const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
  o.type = type || 'square';
  o.frequency.setValueAtTime(f1, n);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), n + dur);
  g.gain.setValueAtTime(vol || 0.07, n);
  g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(n); o.stop(n + dur + 0.02);
}
function crashSound() {
  if (!ac || save.mute) return;
  const len = Math.floor(ac.sampleRate * 0.35), buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = ac.createBufferSource(), g = ac.createGain();
  s.buffer = buf; g.gain.value = 0.25;
  s.connect(g); g.connect(ac.destination); s.start();
}
const coinSound = () => { blip(880, 1320, 0.09, 'square', 0.05); setTimeout(() => blip(1320, 1760, 0.12, 'square', 0.05), 70); };
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

// ---------- helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mod = (a, n) => ((a % n) + n) % n;
const curve = d => 32 * Math.sin(d / 260) + 18 * Math.sin(d / 140 + 1.3);
const hash = n => { n = (n * 374761393 + 668265263) | 0; n = (n ^ (n >>> 13)) * 1274126177 | 0; return (n ^ (n >>> 16)) >>> 0; };
const biomeAt = D => mod(Math.floor(D / ZONE), 4);
const HEB = /[֐-׿]/;

function rgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function shade(hex, a) {
  const c = rgb(hex), t = a < 0 ? 0 : 255, p = Math.abs(a);
  return 'rgb(' + c.map(v => Math.round(v + (t - v) * p)).join(',') + ')';
}
function alpha(hex, a) { return 'rgba(' + rgb(hex).join(',') + ',' + a + ')'; }
function rng(seed) { return () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296; }

function biomeWeights(D) {
  const w = [0, 0, 0, 0], i = Math.floor(D / ZONE), s = D - i * ZONE, cur = mod(i, 4), T = 1800;
  if (s < T && i > 0) { w[cur] = s / T; w[mod(i - 1, 4)] += 1 - s / T; } else w[cur] = 1;
  return w;
}

function rr(x, y, w, h, r, g) {
  g = g || ctx;
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function poly(g, pts) { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); }
function circle(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, 6.2832); }

function text(s, x, y, size, fill, stroke, align) {
  ctx.direction = HEB.test(s) ? 'rtl' : 'ltr';
  ctx.font = '900 ' + size + 'px system-ui,"Segoe UI",Arial,sans-serif';
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = stroke.w; ctx.strokeStyle = stroke.c; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill;
  ctx.fillText(s, x, y);
}
const OUT = { w: 5, c: 'rgba(0,0,0,.55)' };

function heart(x, y, s, fill, line) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.9);
  ctx.bezierCurveTo(x - s * 1.7, y - s * 0.2, x - s * 0.7, y - s * 1.3, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.7, y - s * 1.3, x + s * 1.7, y - s * 0.2, x, y + s * 0.9);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (line) { ctx.lineWidth = 2; ctx.strokeStyle = line; ctx.stroke(); }
}

// ---------- sprites (drawn once at high resolution, then reused) ----------
const sprites = new Map();
function sprite(key, w, h, paint) {
  let s = sprites.get(key);
  if (!s) {
    const c = document.createElement('canvas');
    c.width = Math.ceil(w * SS); c.height = Math.ceil(h * SS);
    const g = c.getContext('2d');
    g.scale(SS, SS); g.translate(w / 2, h / 2);
    paint(g);
    s = { c, w, h };
    sprites.set(key, s);
  }
  return s;
}
function blit(s, x, y, rot, sx, sy) {
  if (!rot && !sx) { ctx.drawImage(s.c, x - s.w / 2, y - s.h / 2, s.w, s.h); return; }
  ctx.save(); ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  if (sx) ctx.scale(sx, sy == null ? sx : sy);
  ctx.drawImage(s.c, -s.w / 2, -s.h / 2, s.w, s.h);
  ctx.restore();
}
function withShadow(g, blur, ox, oy, a, fn) {
  g.save();
  g.shadowColor = 'rgba(0,0,0,' + a + ')';
  g.shadowBlur = blur * SS; g.shadowOffsetX = ox * SS; g.shadowOffsetY = oy * SS;
  fn(); g.restore();
}

// tapered car body, front at the top
function carBody(g, w, h) {
  const fw = w * 0.8;
  g.beginPath();
  g.moveTo(-fw / 2 + 6, -h / 2);
  g.lineTo(fw / 2 - 6, -h / 2);
  g.quadraticCurveTo(fw / 2 + 1, -h / 2, fw / 2 + 1.5, -h / 2 + 6);
  g.lineTo(w / 2, -h / 2 + h * 0.3);
  g.lineTo(w / 2, h / 2 - 6);
  g.quadraticCurveTo(w / 2, h / 2, w / 2 - 6, h / 2);
  g.lineTo(-w / 2 + 6, h / 2);
  g.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - 6);
  g.lineTo(-w / 2, -h / 2 + h * 0.3);
  g.lineTo(-fw / 2 - 1.5, -h / 2 + 6);
  g.quadraticCurveTo(-fw / 2 - 1, -h / 2, -fw / 2 + 6, -h / 2);
  g.closePath();
}
function paintGlass(g, pts, y0, y1) {
  const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0, '#d8f1ff'); gr.addColorStop(0.45, '#5b7c9c'); gr.addColorStop(1, '#1c2c40');
  g.fillStyle = gr; poly(g, pts); g.fill();
  g.fillStyle = 'rgba(255,255,255,.35)';
  poly(g, [[pts[0][0] + 2, pts[0][1] + 1], [pts[0][0] + 6, pts[0][1] + 1], [pts[3][0] + 3, pts[3][1] - 1], [pts[3][0] + 1, pts[3][1] - 1]]); g.fill();
}
function bodyFill(g, body, w) {
  const gr = g.createLinearGradient(-w / 2, 0, w / 2, 0);
  gr.addColorStop(0, shade(body, -0.45)); gr.addColorStop(0.2, body);
  gr.addColorStop(0.48, shade(body, 0.3)); gr.addColorStop(0.8, body); gr.addColorStop(1, shade(body, -0.45));
  return gr;
}
function wheel(g, x, y, ww, wh) {
  g.fillStyle = '#15161a'; rr(x - ww / 2, y - wh / 2, ww, wh, 2, g); g.fill();
  g.fillStyle = 'rgba(255,255,255,.2)'; g.fillRect(x - ww / 2 + 1, y - wh / 2 + 2, ww - 2, 1.4);
}
function lights(g, w, h) {
  g.fillStyle = '#fffbe0';
  rr(-w * 0.4 + 1, -h / 2 + 1, 6, 3, 1.5, g); g.fill();
  rr(w * 0.4 - 7, -h / 2 + 1, 6, 3, 1.5, g); g.fill();
  g.fillStyle = '#ff2b2b';
  rr(-w / 2 + 2, h / 2 - 3.5, 6, 2.6, 1.2, g); g.fill();
  rr(w / 2 - 8, h / 2 - 3.5, 6, 2.6, 1.2, g); g.fill();
}

function paintVehicle(g, style, body, stripe, w, h) {
  if (style === 'f1') return paintF1(g, body, stripe, w, h);
  if (style === 'truck' || style === 'bus') return paintBig(g, style, body, w, h);
  const boxy = style === 'jeep' || style === 'van';
  withShadow(g, 5, 2, 5, 0.45, () => { g.fillStyle = '#000'; rr(-w / 2, -h / 2, w, h, boxy ? 5 : 8, g); g.fill(); });
  const wy = h * 0.29;
  const ww = style === 'jeep' ? 6.5 : 5, wh = style === 'jeep' ? 13 : 11;
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) wheel(g, sx * (w / 2 - 1 + (style === 'jeep' ? 1.5 : 0)), sy * wy, ww, wh);
  g.fillStyle = bodyFill(g, body, w);
  if (boxy) rr(-w / 2, -h / 2, w, h, 5, g); else carBody(g, w, h);
  g.fill();
  g.save(); g.clip();
  const sheen = g.createLinearGradient(0, -h / 2, 0, h / 2);
  sheen.addColorStop(0, 'rgba(255,255,255,.22)'); sheen.addColorStop(0.4, 'rgba(255,255,255,0)'); sheen.addColorStop(1, 'rgba(0,0,0,.18)');
  g.fillStyle = sheen; g.fillRect(-w / 2, -h / 2, w, h);
  if (style === 'sport' || style === 'gold') { g.fillStyle = stripe; g.fillRect(-5.5, -h / 2, 3.5, h); g.fillRect(2, -h / 2, 3.5, h); }
  if (style === 'coupe') { g.fillStyle = stripe; g.fillRect(-w / 2 + 2.5, -h * 0.42, 2, h * 0.84); g.fillRect(w / 2 - 4.5, -h * 0.42, 2, h * 0.84); }
  if (style === 'police') { g.fillStyle = '#16181d'; g.fillRect(-w / 2, -h / 2, w, h * 0.22); g.fillRect(-w / 2, h * 0.3, w, h * 0.2); }
  if (style === 'taxi') {
    g.fillStyle = '#1a1a1a';
    for (let i = 0; i < 6; i++) g.fillRect(-w / 2 + i * (w / 6), h * 0.02 + (i % 2) * 2.5, w / 6, 2.5);
  }
  g.restore();
  // hood creases
  g.strokeStyle = 'rgba(0,0,0,.16)'; g.lineWidth = 0.8;
  g.beginPath(); g.moveTo(-w * 0.2, -h / 2 + 3); g.lineTo(-w * 0.24, -h * 0.25); g.moveTo(w * 0.2, -h / 2 + 3); g.lineTo(w * 0.24, -h * 0.25); g.stroke();
  if (style === 'jeep') {
    paintGlass(g, [[-w / 2 + 3, -h * 0.2], [w / 2 - 3, -h * 0.2], [w / 2 - 3, -h * 0.1], [-w / 2 + 3, -h * 0.1]], -h * 0.2, -h * 0.1);
    g.fillStyle = shade(body, -0.25); rr(-w / 2 + 3, -h * 0.08, w - 6, h * 0.46, 3, g); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 1;
    g.beginPath(); for (let i = 0; i < 4; i++) { const y = -h * 0.04 + i * h * 0.11; g.moveTo(-w / 2 + 5, y); g.lineTo(w / 2 - 5, y); } g.stroke();
    wheel(g, 0, h / 2 + 1, 12, 5);
  } else if (style === 'van') {
    paintGlass(g, [[-w / 2 + 3, -h * 0.34], [w / 2 - 3, -h * 0.34], [w / 2 - 4, -h * 0.2], [-w / 2 + 4, -h * 0.2]], -h * 0.34, -h * 0.2);
    g.fillStyle = 'rgba(255,255,255,.14)'; rr(-w / 2 + 4, -h * 0.17, w - 8, h * 0.62, 3, g); g.fill();
    g.strokeStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.moveTo(0, h * 0.3); g.lineTo(0, h / 2); g.stroke();
  } else {
    paintGlass(g, [[-w / 2 + 3, -h * 0.23], [w / 2 - 3, -h * 0.23], [w / 2 - 4.5, -h * 0.06], [-w / 2 + 4.5, -h * 0.06]], -h * 0.23, -h * 0.06);
    g.fillStyle = 'rgba(255,255,255,.1)'; rr(-w / 2 + 5, -h * 0.05, w - 10, h * 0.18, 3, g); g.fill();
    g.fillStyle = '#1c2c40'; poly(g, [[-w / 2 + 4.5, h * 0.15], [w / 2 - 4.5, h * 0.15], [w / 2 - 3.5, h * 0.27], [-w / 2 + 3.5, h * 0.27]]); g.fill();
  }
  // mirrors
  g.fillStyle = shade(body, -0.35);
  rr(-w / 2 - 2.5, -h * 0.19, 3.5, 4, 1.2, g); g.fill(); rr(w / 2 - 1, -h * 0.19, 3.5, 4, 1.2, g); g.fill();
  lights(g, w, h);
  if (style === 'sport' || style === 'gold') {
    g.fillStyle = shade(body, -0.55); rr(-w / 2 - 1, h / 2 - 5, w + 2, 4, 1.5, g); g.fill();
  }
  if (style === 'taxi') {
    g.fillStyle = '#fff7cc'; rr(-7, -h * 0.02 - 6, 14, 6, 2, g); g.fill();
    g.fillStyle = '#1a1a1a'; g.font = '900 4.5px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('TAXI', 0, -h * 0.02 - 3);
  }
  if (style === 'police') {
    g.fillStyle = '#ff2d55'; rr(-8, -h * 0.02, 7, 4, 1.5, g); g.fill();
    g.fillStyle = '#2d7bff'; rr(1, -h * 0.02, 7, 4, 1.5, g); g.fill();
  }
  if (style === 'gold') {
    g.fillStyle = '#fff';
    for (const [x, y, r] of [[-7, -14, 2.4], [6, 8, 2], [-4, 15, 1.6], [8, -6, 1.4]]) {
      poly(g, [[x, y - r * 2], [x + r * 0.5, y - r * 0.5], [x + r * 2, y], [x + r * 0.5, y + r * 0.5], [x, y + r * 2], [x - r * 0.5, y + r * 0.5], [x - r * 2, y], [x - r * 0.5, y - r * 0.5]]); g.fill();
    }
  }
}
function paintF1(g, body, stripe, w, h) {
  withShadow(g, 5, 2, 5, 0.45, () => {
    g.fillStyle = '#000';
    rr(-6, -h / 2 + 2, 12, h - 4, 5, g); g.fill();
    g.fillRect(-w / 2, -h / 2, w, 5); g.fillRect(-w / 2 + 1, h / 2 - 6, w - 2, 6);
  });
  for (const sx of [-1, 1]) { wheel(g, sx * (w / 2 - 3.5), -h * 0.27, 7, 11); wheel(g, sx * (w / 2 - 3.5), h * 0.28, 8, 12); }
  g.fillStyle = shade(body, -0.3); rr(-w / 2, -h / 2, w, 4.5, 2, g); g.fill();
  g.fillStyle = bodyFill(g, body, 18);
  g.beginPath();
  g.moveTo(-3, -h / 2 + 1); g.lineTo(3, -h / 2 + 1); g.lineTo(5, -h * 0.12); g.lineTo(9, -h * 0.02); g.lineTo(9, h * 0.32);
  g.lineTo(4, h / 2 - 4); g.lineTo(-4, h / 2 - 4); g.lineTo(-9, h * 0.32); g.lineTo(-9, -h * 0.02); g.lineTo(-5, -h * 0.12); g.closePath(); g.fill();
  g.fillStyle = stripe; g.fillRect(-1.5, -h / 2 + 2, 3, h * 0.36);
  g.fillStyle = '#16181d'; rr(-4.5, -h * 0.1, 9, 13, 4, g); g.fill();
  const hg = g.createRadialGradient(-1, -h * 0.03 - 1, 0.5, 0, -h * 0.03, 4.2);
  hg.addColorStop(0, '#ffffff'); hg.addColorStop(1, stripe);
  g.fillStyle = hg; circle(g, 0, -h * 0.03, 3.8); g.fill();
  g.fillStyle = shade(body, -0.5); rr(-w / 2 + 1, h / 2 - 6, w - 2, 5, 2, g); g.fill();
  g.fillStyle = stripe; g.fillRect(-w / 2 + 2, h / 2 - 4.5, w - 4, 1.5);
}
function paintBig(g, style, body, w, h) {
  withShadow(g, 6, 2, 6, 0.45, () => { g.fillStyle = '#000'; rr(-w / 2, -h / 2, w, h, 4, g); g.fill(); });
  for (const sx of [-1, 1]) for (const y of [-0.32, 0.22, 0.38]) wheel(g, sx * (w / 2 - 0.5), y * h, 5, 11);
  if (style === 'truck') {
    g.fillStyle = bodyFill(g, '#33364a', w); rr(-w / 2 + 1.5, -h / 2, w - 3, h * 0.24, 5, g); g.fill();
    paintGlass(g, [[-w / 2 + 4, -h / 2 + 4], [w / 2 - 4, -h / 2 + 4], [w / 2 - 4, -h / 2 + 10], [-w / 2 + 4, -h / 2 + 10]], -h / 2 + 4, -h / 2 + 10);
    g.fillStyle = bodyFill(g, body, w); rr(-w / 2, -h / 2 + h * 0.26, w, h * 0.74, 3, g); g.fill();
    g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 1;
    g.beginPath(); for (let i = 1; i < 7; i++) { const y = -h / 2 + h * 0.26 + i * h * 0.105; g.moveTo(-w / 2 + 2, y); g.lineTo(w / 2 - 2, y); } g.stroke();
  } else {

// ---------- game state ----------
let state = 'menu';        // menu | garage | play | paused | over
let t = 0, demoDist = 0;
let dist = 0, speed = 0, px = W / 2, tx = W / 2;
let lives = 3, coinsRun = 0, smashes = 0, invuln = 0, nitro = 0, shake = 0, flash = 0;
let countdown = 0, goFlash = 0, overT = 0, offroad = false;
let traffic = [], coins = [], bolts = [], parts = [], confetti = [];
let nextRow = 0, nextCoin = 0, nextBolt = 0, prevFree = null, nextMilestone = 250, lastBiome = 0;
let score = 0, newBest = false, popup = null, garageMsg = 0, lastTick = 0;
let ui = [];
const lamps = [];
const keys = { left: false, right: false };
const flakes = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * 900, r: 0.8 + Math.random() * 2.2, s: Math.random() }));
const BIOME_NAMES = ['אחו ירוק', 'מדבר', 'ארץ השלג', 'לילה'];

const carX = (lane, D, vd) => W / 2 + (curve(D) - curve(vd)) + (lane - 1.5) * LANE;
const screenY = (D, vd) => PLAYER_Y - (D - vd);

function startRun() {
  audioInit();
  state = 'play';
  dist = 0; speed = 150; px = W / 2; tx = px;
  lives = 3; coinsRun = 0; smashes = 0; invuln = 0; nitro = 0; shake = 0; flash = 0;
  traffic = []; coins = []; bolts = []; parts = []; confetti = []; popup = null;
  nextRow = 650; nextCoin = 900; nextBolt = 2600; prevFree = null; nextMilestone = 250; lastBiome = 0;
  countdown = 3; goFlash = 0; lastTick = 4;
}
function endRun() {
  state = 'over'; overT = 0;
  score = Math.floor(dist / 50) + coinsRun * 10 + smashes * 25;
  newBest = score > save.best && score > 0;
  if (newBest) {
    save.best = score;
    const cols = ['#ffd60a', '#ff4d6d', '#4cc9f0', '#7CFC00', '#ff9f1c', '#c77dff'];
    for (let i = 0; i < 90; i++) confetti.push({ x: Math.random() * W, y: -20 - Math.random() * 300, vx: (Math.random() - 0.5) * 60, vy: 80 + Math.random() * 120, r: Math.random() * 6, vr: (Math.random() - 0.5) * 10, c: cols[i % cols.length], s: 4 + Math.random() * 4 });
  }
  persist();
  engineSet(false, 0);
}
function showPopup(s, sub) { popup = { s, sub, life: 1.8 }; }

// ---------- spawning ----------
function pickType(single) {
  const r = Math.random();
  if (single) { if (r < 0.12) return 'truck'; if (r < 0.22) return 'bus'; if (r < 0.32) return 'van'; }
  return Math.random() < 0.08 ? 'police' : 'sedan';
}
function spawnRow(D) {
  let lanes = null, free = null;
  for (let tries = 0; tries < 6; tries++) {
    const n = Math.random() < 0.62 ? 1 : 2;
    lanes = [];
    while (lanes.length < n) { const l = (Math.random() * 4) | 0; if (!lanes.includes(l)) lanes.push(l); }
    free = [0, 1, 2, 3].filter(l => !lanes.includes(l));
    if (!prevFree || free.some(l => prevFree.includes(l))) break;
    if (tries === 5) { lanes = [lanes[0]]; free = [0, 1, 2, 3].filter(l => l !== lanes[0]); }
  }
  prevFree = free;
  for (const l of lanes) {
    const type = pickType(lanes.length === 1);
    const d = BIG[type] || [PW, PH];
    const color = type === 'police' ? '#f4f4f4' : type === 'bus' ? '#ffb703' : TRAFFIC_COLORS[(Math.random() * TRAFFIC_COLORS.length) | 0];
    traffic.push({ lane: l, D, type, w: d[0], h: d[1], color, spr: vehicleSprite(type, color, null) });
    coins = coins.filter(c => !(c.lane === l && Math.abs(c.D - D) < 120));
  }
}
function spawnCoins(D) {
  const lane = (Math.random() * 4) | 0;
  for (let i = 0; i < 5; i++) {
    const cd = D + i * 48;
    if (traffic.some(c => c.lane === lane && Math.abs(c.D - cd) < 100)) continue;
    coins.push({ lane, D: cd });
  }
}
function spawnBolt(D) {
  const lane = (Math.random() * 4) | 0;
  if (traffic.some(c => c.lane === lane && Math.abs(c.D - D) < 100)) D += 160;
  bolts.push({ lane, D });
}
function burst(x, y, color, n, power, kind) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.2832, p = (0.3 + Math.random()) * power;
    parts.push({ x, y, vx: Math.cos(a) * p, vy: Math.sin(a) * p, life: 0.5 + Math.random() * 0.4, max: 0.9, color, size: 2 + Math.random() * 3, kind: kind || 'sq' });
  }
}

// ---------- update ----------
function steer(dt) {
  if (keys.left) tx -= 430 * dt;
  if (keys.right) tx += 430 * dt;
  tx = clamp(tx, 16, W - 16);
  px += (tx - px) * Math.min(1, dt * 11);
  px = clamp(px, 16, W - 16);
}

function hit(car) {
  const x = carX(car.lane, car.D, dist), y = screenY(car.D, dist);
  traffic.splice(traffic.indexOf(car), 1);
  if (nitro > 0) {
    smashes++;
    burst(x, y, car.color, 16, 170);
    burst(x, y, '#ffd166', 10, 120);
    for (let i = 0; i < 6; i++) parts.push({ x, y, vx: (Math.random() - 0.5) * 80, vy: (Math.random() - 0.5) * 80 + speed * 0.3, life: 0.8, max: 0.8, color: '#9aa0a8', size: 10, kind: 'puff' });
    blip(300, 80, 0.2, 'sawtooth', 0.09);
    showPopup('בום!');
    return;
  }
  if (invuln > 0) return;
  lives--;
  invuln = 1.7; shake = 0.4; flash = 0.25;
  speed *= 0.45;
  burst(x, y, '#ffb703', 14, 140);
  for (let i = 0; i < 5; i++) parts.push({ x, y, vx: (Math.random() - 0.5) * 60, vy: speed * 0.3 + Math.random() * 40, life: 0.9, max: 0.9, color: '#6b7078', size: 9, kind: 'puff' });
  crashSound(); buzz(180);
  if (lives <= 0) endRun();
}

function updatePlay(dt) {
  steer(dt);
  if (countdown > 0) {
    countdown -= dt;
    const c = Math.ceil(countdown);
    if (c !== lastTick && c > 0) { lastTick = c; blip(520, 520, 0.12, 'square', 0.05); }
    if (countdown <= 0) { goFlash = 0.8; blip(780, 1040, 0.25, 'square', 0.07); }
    return;
  }
  goFlash = Math.max(0, goFlash - dt);
  const base = 320 + Math.min(280, dist / 90);
  offroad = Math.abs(px - W / 2) > HALF + 6;
  const target = base * (nitro > 0 ? 1.5 : 1) * (offroad && nitro <= 0 ? 0.55 : 1);
  speed += (target - speed) * Math.min(1, dt * (target < speed ? 3 : 1.4));
  dist += speed * dt;
  invuln = Math.max(0, invuln - dt);
  nitro = Math.max(0, nitro - dt);
  shake = Math.max(0, shake - dt);
  flash = Math.max(0, flash - dt);
  if (popup && (popup.life -= dt) <= 0) popup = null;

  const horizon = dist + PLAYER_Y + 160;
  while (nextRow < horizon) { spawnRow(nextRow); nextRow += Math.max(230, 360 - dist / 120) * (0.85 + Math.random() * 0.4); }
  while (nextCoin < horizon) { spawnCoins(nextCoin); nextCoin += 420 + Math.random() * 500; }
  while (nextBolt < horizon) { spawnBolt(nextBolt); nextBolt += 2600 + Math.random() * 1800; }

  const ts = base * 0.42;
  for (const c of traffic) c.D += ts * dt;
  traffic = traffic.filter(c => screenY(c.D, dist) < H + 120);
  coins = coins.filter(c => screenY(c.D, dist) < H + 40);
  bolts = bolts.filter(c => screenY(c.D, dist) < H + 40);

  for (const c of traffic.slice()) {
    const x = carX(c.lane, c.D, dist), y = screenY(c.D, dist);
    if (Math.abs(x - px) < (c.w + PW) / 2 * 0.78 && Math.abs(y - PLAYER_Y) < (c.h + PH) / 2 * 0.85) { hit(c); if (state !== 'play') return; }
  }
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i], x = carX(c.lane, c.D, dist), y = screenY(c.D, dist);
    if (Math.abs(x - px) < 22 && Math.abs(y - PLAYER_Y) < 32) {
      coins.splice(i, 1); coinsRun++; save.coins++; persist(); coinSound();
      burst(x, y, '#ffe066', 6, 90, 'star');
    }
  }
  for (let i = bolts.length - 1; i >= 0; i--) {
    const c = bolts[i], x = carX(c.lane, c.D, dist), y = screenY(c.D, dist);
    if (Math.abs(x - px) < 24 && Math.abs(y - PLAYER_Y) < 34) {
      bolts.splice(i, 1); nitro = 3.2; showPopup('טורבו!');
      burst(x, y, '#4cc9f0', 14, 140, 'star');
      blip(300, 1200, 0.4, 'sawtooth', 0.08); buzz(60);
    }
  }
  const b = biomeAt(dist);
  if (b !== lastBiome) { lastBiome = b; showPopup(BIOME_NAMES[b], 'עולם חדש'); }
  const m = Math.floor(dist / 50);
  if (m >= nextMilestone) { if (!popup) showPopup(String(m), 'מטר'); nextMilestone += 250; }

  if (offroad && nitro <= 0 && Math.random() < dt * 30) {
    const dc = ['#8a6a3a', '#d9b56e', '#ffffff', '#5a4a30'][biomeAt(dist)];
    parts.push({ x: px + (Math.random() - 0.5) * 20, y: PLAYER_Y + 20, vx: (Math.random() - 0.5) * 50, vy: speed * 0.35, life: 0.6, max: 0.6, color: dc, size: 7, kind: 'puff' });
  }
  if (nitro > 0) {
    parts.push({ x: px + (Math.random() - 0.5) * 10, y: PLAYER_Y + 24, vx: (Math.random() - 0.5) * 30, vy: 260 + Math.random() * 120, life: 0.3, max: 0.3, color: Math.random() < 0.5 ? '#ffb703' : '#ff6b35', size: 3 + Math.random() * 3, kind: 'sq' });
  }
  engineSet(true, speed);
}

function update(dt) {
  t += dt;
  if (state === 'menu' || state === 'garage') demoDist += 260 * dt;
  else if (state === 'play') updatePlay(dt);
  else if (state === 'over') {
    overT += dt;
    speed *= Math.pow(0.15, dt);
    dist += speed * dt;
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (const c of confetti) { c.x += c.vx * dt; c.y += c.vy * dt; c.r += c.vr * dt; c.vx += Math.sin(t * 3 + c.s) * 20 * dt; }
  confetti = confetti.filter(c => c.y < H + 20);
  const fs = state === 'play' ? speed : 260;
  for (const f of flakes) {
    f.y += (25 + f.r * 18 + fs * 0.25) * dt;
    f.x += Math.sin(t * 1.5 + f.s * 9) * 14 * dt;
    if (f.y > H + 5) { f.y = -5; f.x = Math.random() * W; }
  }
  garageMsg = Math.max(0, garageMsg - dt);
}

// ---------- drawing: world ----------
function drawGround(vd) {
  const Dtop = vd + PLAYER_Y, Dbot = vd - (H - PLAYER_Y);
  const bTop = biomeAt(Dtop), bBot = biomeAt(Dbot);
  const region = (b, y0, y1) => {
    if (y1 <= y0) return;
    ctx.fillStyle = BIOMES[b].ground; ctx.fillRect(0, y0, W, y1 - y0);
    ctx.save(); ctx.beginPath(); ctx.rect(0, y0, W, y1 - y0); ctx.clip();
    fillTex(groundTex[b], TEX, vd);
    ctx.restore();
  };
  if (bTop === bBot) region(bBot, 0, H);
  else {
    const yb = screenY(Math.floor(Dtop / ZONE) * ZONE, vd);
    region(bTop, 0, yb); region(bBot, yb, H);
    let g = ctx.createLinearGradient(0, yb - 90, 0, yb);
    g.addColorStop(0, alpha(BIOMES[bBot].ground, 0)); g.addColorStop(1, alpha(BIOMES[bBot].ground, 0.85));
    ctx.fillStyle = g; ctx.fillRect(0, yb - 90, W, 90);
    g = ctx.createLinearGradient(0, yb, 0, yb + 90);
    g.addColorStop(0, alpha(BIOMES[bTop].ground, 0.85)); g.addColorStop(1, alpha(BIOMES[bTop].ground, 0));
    ctx.fillStyle = g; ctx.fillRect(0, yb, W, 90);
  }
  for (let j = Math.floor(Dbot / 120); j <= Math.floor(Dtop / 120); j++) {
    if (!(j & 1)) continue;
    ctx.fillStyle = BIOMES[biomeAt(j * 120)].band;
    ctx.fillRect(0, screenY(j * 120 + 120, vd), W, 120);
  }
}

function drawRoad(vd) {
  const cvd = curve(vd), STEP = 10;
  const Dtop = vd + PLAYER_Y + 20, Dbot = vd - (H - PLAYER_Y) - 20;
  const ex = (D, off) => W / 2 + curve(D) - cvd + off;
  const pts = [];
  for (let D = Dtop; D > Dbot - STEP; D -= STEP) pts.push([screenY(D, vd), W / 2 + curve(D) - cvd]);
  const band = (a, b) => {
    ctx.beginPath();
    for (const p of pts) ctx.lineTo(p[1] + a, p[0]);
    for (let i = pts.length - 1; i >= 0; i--) ctx.lineTo(pts[i][1] + b, pts[i][0]);
    ctx.closePath();
  };
  const line = off => { ctx.beginPath(); for (const p of pts) ctx.lineTo(p[1] + off, p[0]); };

  ctx.fillStyle = 'rgba(0,0,0,.18)'; band(-HALF - 22, HALF + 22); ctx.fill();
  ctx.fillStyle = '#f2f2f2'; band(-HALF - 12, HALF + 12); ctx.fill();
  ctx.fillStyle = '#e63946'; ctx.beginPath();
  const KB = 36;
  for (let j = Math.floor(Dbot / KB); j <= Math.floor(Dtop / KB); j++) {
    if (j & 1) continue;
    const D0 = j * KB, D1 = D0 + KB, Dm = D0 + KB / 2;
    for (const s of [-1, 1]) {
      const o = s * (HALF + 12), i = s * HALF;
      ctx.moveTo(ex(D0, o), screenY(D0, vd)); ctx.lineTo(ex(Dm, o), screenY(Dm, vd)); ctx.lineTo(ex(D1, o), screenY(D1, vd));
      ctx.lineTo(ex(D1, i), screenY(D1, vd)); ctx.lineTo(ex(Dm, i), screenY(Dm, vd)); ctx.lineTo(ex(D0, i), screenY(D0, vd)); ctx.closePath();
    }
  }
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1.5;
  line(-HALF - 12); ctx.stroke(); line(HALF + 12); ctx.stroke();

  band(-HALF, HALF);
  const ag = ctx.createLinearGradient(W / 2 - HALF - 50, 0, W / 2 + HALF + 50, 0);
  ag.addColorStop(0, '#30343b'); ag.addColorStop(0.5, '#41464f'); ag.addColorStop(1, '#30343b');
  ctx.fillStyle = ag; ctx.fill();
  ctx.save(); ctx.clip();
  fillTex(asphaltTex, 128, vd);
  ctx.strokeStyle = 'rgba(0,0,0,.09)'; ctx.lineWidth = 20;
  for (let i = 0; i < 4; i++) { line((i - 1.5) * LANE); ctx.stroke(); }
  ctx.restore();
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 3;
  line(-HALF + 1.5); ctx.stroke(); line(HALF - 1.5); ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2.5;
  line(-HALF + 8); ctx.stroke(); line(HALF - 8); ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,.88)'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  ctx.beginPath();
  const DL = 64;
  for (let j = Math.floor(Dbot / DL); j <= Math.floor(Dtop / DL); j++) {
    if (j & 1) continue;
    const D0 = j * DL, D1 = D0 + DL * 0.6, Dm = (D0 + D1) / 2;
    for (let i = 1; i < 4; i++) {
      const o = (i - 2) * LANE;
      ctx.moveTo(ex(D0, o), screenY(D0, vd)); ctx.lineTo(ex(Dm, o), screenY(Dm, vd)); ctx.lineTo(ex(D1, o), screenY(D1, vd));
    }
  }
  ctx.stroke(); ctx.lineCap = 'butt';
}

function drawDecor(vd) {
  const cvd = curve(vd), SP = 70;
  lamps.length = 0;
  const k0 = Math.floor((vd - (H - PLAYER_Y) - 60) / SP), k1 = Math.floor((vd + PLAYER_Y + 60) / SP);
  for (let k = k0; k <= k1; k++) for (let s = -1; s <= 1; s += 2) {
    const h = hash(k * 2 + (s > 0 ? 1 : 0));
    const D = k * SP + (h % 40);
    const x = W / 2 + curve(D) - cvd + s * (HALF + 36 + (h % 60));
    const y = screenY(D, vd);
    if (x < -40 || x > W + 40) continue;
    const b = biomeAt(D), r = (h >>> 9) % 100, v = (h >>> 4);
    let spr = null;
    if (b === 0) spr = r < 55 ? treeSprite(v % 4) : r < 85 ? bushSprite(v % 3) : null;
    else if (b === 1) spr = r < 40 ? cactusSprite(v % 2) : r < 72 ? rockSprite(v % 3) : null;
    else if (b === 2) spr = r < 62 ? pineSprite(v % 3) : r < 72 ? snowmanSprite() : r < 90 ? rockSprite(v % 3, true) : null;
    else spr = r < 60 ? treeSprite(v % 2) : r < 80 ? bushSprite(v % 3) : null;
    if (spr) blit(spr, x, y);
  }
  const L = 200;
  for (let k = Math.floor((vd - (H - PLAYER_Y) - 40) / L); k <= Math.floor((vd + PLAYER_Y + 40) / L); k++) {
    const D = k * L;
    if (biomeAt(D) !== 3) continue;
    const s = (k & 1) ? 1 : -1;
    const x = W / 2 + curve(D) - cvd + s * (HALF + 22), y = screenY(D, vd);
    blit(lampSprite(s), x, y);
    lamps.push([x - s * 6, y]);
  }
}

function drawClouds(vd, a) {
  if (a <= 0.01) return;
  const CS = 520;
  ctx.globalAlpha = a;
  for (let k = Math.floor((vd - H) / CS); k <= Math.floor((vd + PLAYER_Y + 200) / CS); k++) {
    const h = hash(k * 7 + 3);
    blit(cloudSprite(), (h % 420) - 30, screenY(k * CS * 1.0, vd), 0, 1 + (h % 5) * 0.12);
  }
  ctx.globalAlpha = 1;
}

function drawObjects() {
  const cs = coinSprite();
  for (const c of coins) {
    const x = carX(c.lane, c.D, dist), y = screenY(c.D, dist);
    if (y < -20 || y > H + 20) continue;
    const sq = Math.cos(t * 5 + c.D * 0.05);
    blit(cs, x, y, 0, Math.max(0.15, Math.abs(sq)), 1);
  }
  for (const b of bolts) {
    const x = carX(b.lane, b.D, dist), y = screenY(b.D, dist);
    if (y < -30 || y > H + 30) continue;
    blit(boltSprite(), x, y, 0, 1 + Math.sin(t * 8) * 0.08);
  }
  for (const c of traffic) {
    const y = screenY(c.D, dist);
    if (y < -70 || y > H + 70) continue;
    blit(c.spr, carX(c.lane, c.D, dist), y);
  }
}

function drawPlayer() {
  if (invuln > 0 && nitro <= 0 && Math.floor(t * 14) % 2) return;
  const car = CARS[save.car] || CARS[0];
  if (nitro > 0) {
    const fl = 16 + Math.random() * 14;
    const g = ctx.createLinearGradient(0, PLAYER_Y + 22, 0, PLAYER_Y + 22 + fl);
    g.addColorStop(0, '#fff3a0'); g.addColorStop(0.4, '#ffb703'); g.addColorStop(1, 'rgba(255,80,0,0)');
    ctx.fillStyle = g;
    for (const sx of [-6, 6]) { ctx.beginPath(); ctx.moveTo(px + sx - 4, PLAYER_Y + 21); ctx.lineTo(px + sx + 4, PLAYER_Y + 21); ctx.lineTo(px + sx, PLAYER_Y + 22 + fl); ctx.fill(); }
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.6;
    blit(glowSprite('#4cc9f0'), px, PLAYER_Y, 0, 1.4);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  }
  blit(vehicleSprite(car.style, car.body, car.stripe), px, PLAYER_Y, clamp((tx - px) * 0.012, -0.25, 0.25));
}

function drawParts() {
  for (const p of parts) {
    const k = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = p.kind === 'puff' ? k * 0.5 : k;
    ctx.fillStyle = p.color;
    if (p.kind === 'puff') { circle(ctx, p.x, p.y, p.size * (1.8 - k)); ctx.fill(); }
    else if (p.kind === 'star') { const s = p.size; poly(ctx, [[p.x, p.y - s], [p.x + s * 0.3, p.y - s * 0.3], [p.x + s, p.y], [p.x + s * 0.3, p.y + s * 0.3], [p.x, p.y + s], [p.x - s * 0.3, p.y + s * 0.3], [p.x - s, p.y], [p.x - s * 0.3, p.y - s * 0.3]]); ctx.fill(); }
    else ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawSpeedLines() {
  ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 2;
  for (let i = 0; i < 14; i++) {
    const x = (i * 53.7 + 11) % W, y = ((t * 1100 + i * 97) % (H + 90)) - 45;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 42); ctx.stroke();
  }
}

function drawSnow(a) {
  if (a <= 0.01) return;
  ctx.fillStyle = '#ffffff';
  for (const f of flakes) { ctx.globalAlpha = a * (0.5 + f.s * 0.5); circle(ctx, f.x, f.y % (H + 10), f.r); ctx.fill(); }
  ctx.globalAlpha = 1;
}

function cone(g, x, y, len, w0, w1, a) {
  const gr = g.createLinearGradient(0, y, 0, y - len);
  gr.addColorStop(0, 'rgba(0,0,0,' + a + ')'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr;
  g.beginPath(); g.moveTo(x - w0, y); g.lineTo(x + w0, y); g.lineTo(x + w1, y - len); g.lineTo(x - w1, y - len); g.closePath(); g.fill();
}
function drawNight(a, game) {
  if (a <= 0.01) return;
  lg.setTransform(0.5, 0, 0, 0.5, 0, 0);
  lg.globalCompositeOperation = 'source-over';
  lg.clearRect(0, 0, W, H);
  lg.fillStyle = 'rgba(8,12,40,' + (0.72 * a) + ')';
  lg.fillRect(0, 0, W, H);
  lg.globalCompositeOperation = 'destination-out';
  for (const [x, y] of lamps) {
    const gr = lg.createRadialGradient(x, y, 0, x, y, 75);
    gr.addColorStop(0, 'rgba(0,0,0,.9)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    lg.fillStyle = gr; lg.fillRect(x - 75, y - 75, 150, 150);
  }
  if (game) {
    cone(lg, px, PLAYER_Y - PH / 2 + 2, 190, 11, 55, 0.95);
    for (const c of traffic) {
      const y = screenY(c.D, dist);
      if (y < -80 || y > H + 200) continue;
      cone(lg, carX(c.lane, c.D, dist), y - c.h / 2 + 2, 120, 9, 38, 0.7);
    }
  }
  ctx.drawImage(lightC, 0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  const warm = glowSprite('#ffcf70'), red = glowSprite('#ff3030'), blue = glowSprite('#2d7bff'), white = glowSprite('#fff6d0');
  for (const [x, y] of lamps) { ctx.globalAlpha = a * 0.8; blit(warm, x, y, 0, 0.7); }
  if (game) {
    for (const c of traffic) {
      const x = carX(c.lane, c.D, dist), y = screenY(c.D, dist);
      if (y < -60 || y > H + 60) continue;
      ctx.globalAlpha = a * 0.75;
      blit(red, x - c.w / 2 + 5, y + c.h / 2 - 2, 0, 0.35); blit(red, x + c.w / 2 - 5, y + c.h / 2 - 2, 0, 0.35);
      if (c.type === 'police') { ctx.globalAlpha = a; blit(Math.floor(t * 6) % 2 ? red : blue, x, y, 0, 0.9); }
    }
    ctx.globalAlpha = a * 0.9;
    blit(white, px - 8, PLAYER_Y - PH / 2 + 2, 0, 0.35); blit(white, px + 8, PLAYER_Y - PH / 2 + 2, 0, 0.35);
    const cs = glowSprite('#ffd60a');
    for (const c of coins) { const y = screenY(c.D, dist); if (y > -20 && y < H + 20) { ctx.globalAlpha = a * 0.5; blit(cs, carX(c.lane, c.D, dist), y, 0, 0.6); } }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawWorld(vd, game) {
  drawGround(vd);
  drawRoad(vd);
  drawDecor(vd);
  if (game) { drawObjects(); if (nitro > 0) drawSpeedLines(); drawPlayer(); }
  drawParts();
  const w = biomeWeights(vd);
  drawClouds(vd, w[0] + w[1]);
  drawSnow(w[2]);
  drawNight(w[3], game);
  ctx.drawImage(vignette, 0, 0, W, H);
}

// ---------- drawing: HUD / screens ----------
function button(x, y, w, h, label, c1, c2, fn, size) {
  const pressed = pressedAt && pressedAt.x >= x - w / 2 && pressedAt.x <= x + w / 2 && pressedAt.y >= y - h / 2 && pressedAt.y <= y + h / 2;
  const dy = pressed ? 4 : 0;
  ctx.fillStyle = 'rgba(0,0,0,.3)'; rr(x - w / 2 + 2, y - h / 2 + 9, w, h, 18); ctx.fill();
  ctx.fillStyle = c2; rr(x - w / 2, y - h / 2 + 6, w, h, 18); ctx.fill();
  const g = ctx.createLinearGradient(0, y - h / 2 + dy, 0, y + h / 2 + dy);
  g.addColorStop(0, shade(c1, 0.18)); g.addColorStop(1, c1);
  ctx.fillStyle = g; rr(x - w / 2, y - h / 2 + dy, w, h, 18); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.22)'; rr(x - w / 2 + 6, y - h / 2 + 4 + dy, w - 12, h * 0.36, 12); ctx.fill();
  text(label, x, y + 2 + dy, size || 26, '#fff', { w: 5, c: 'rgba(0,0,0,.3)' });
  ui.push({ x: x - w / 2, y: y - h / 2, w, h, fn });
}
function pill(x, y, w, h) { ctx.fillStyle = 'rgba(10,16,30,.45)'; rr(x, y, w, h, h / 2); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 1.5; ctx.stroke(); }

function drawHud() {
  pill(8, 10, 92, 34);
  for (let i = 0; i < 3; i++) {
    if (i < lives) heart(28 + i * 26, 27, 8.5, '#ff4d6d', '#ffffff');
    else heart(28 + i * 26, 27, 8.5, 'rgba(0,0,0,.35)', 'rgba(255,255,255,.35)');
  }
  const sc = Math.floor(dist / 50) + coinsRun * 10 + smashes * 25;
  pill(W / 2 - 52, 8, 104, 40);
  text(String(sc), W / 2, 29, 28, '#fff');

  blit(coinSprite(), W - 72, 27, 0, 0.85);
  text(String(coinsRun), W - 56, 28, 22, '#ffe066', null, 'left');
  if (nitro > 0) {
    ctx.fillStyle = 'rgba(0,0,0,.45)'; rr(W / 2 - 70, H - 36, 140, 14, 7); ctx.fill();
    const g = ctx.createLinearGradient(W / 2 - 70, 0, W / 2 + 70, 0);
    g.addColorStop(0, '#4cc9f0'); g.addColorStop(1, '#ffd60a');

  }

    if (popup.sub) text(popup.sub, W / 2, 130 - k * 8, 18, '#ffffff', OUT);

  }

function drawCountdown() {
  if (countdown > 0) {
    const c = Math.ceil(countdown), f = countdown - Math.floor(countdown);
    ctx.save(); ctx.translate(W / 2, H * 0.36); ctx.scale(1 + f * 0.5, 1 + f * 0.5);
    ctx.globalAlpha = clamp(0.4 + f, 0, 1);
    const g = ctx.createLinearGradient(0, -50, 0, 50); g.addColorStop(0, '#fff3a0'); g.addColorStop(1, '#ff9f1c');
    text(String(c), 0, 0, 120, g, { w: 12, c: 'rgba(60,20,0,.6)' });
    ctx.restore(); ctx.globalAlpha = 1;
    text('גוררים עם האצבע כדי לנהוג', W / 2, H * 0.36 + 96, 19, '#fff', OUT);
  } else if (goFlash > 0) {
    ctx.globalAlpha = clamp(goFlash * 2, 0, 1);
    ctx.save(); ctx.translate(W / 2, H * 0.36); const s = 1 + (0.8 - goFlash) * 0.6; ctx.scale(s, s);
    text('קדימה!', 0, 0, 66, '#7CFC00', { w: 9, c: 'rgba(0,40,0,.6)' });
    ctx.restore(); ctx.globalAlpha = 1;
  }
}

function title(s, y, size) {
  text(s, W / 2 + 3, y + 6, size, 'rgba(0,0,0,.35)', { w: 12, c: 'rgba(0,0,0,.35)' });
  const g = ctx.createLinearGradient(0, y - size / 2, 0, y + size / 2);
  g.addColorStop(0, '#fff6b0'); g.addColorStop(0.5, '#ffd60a'); g.addColorStop(1, '#ff8c1a');
  text(s, W / 2, y, size, g, { w: 12, c: '#6b2300' });
}

function drawMenu() {
  drawWorld(demoDist, false);
  const g = ctx.createLinearGradient(0, 0, 0, H * 0.35);
  g.addColorStop(0, 'rgba(0,0,0,.45)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H * 0.35);
  const bob = Math.sin(t * 2.2) * 3;
  ctx.save(); ctx.translate(0, bob);
  ctx.save(); ctx.translate(W / 2, H * 0.11); ctx.rotate(-0.04); ctx.translate(-W / 2, -H * 0.11);
  title('מירוץ', H * 0.11, 66);
  ctx.restore();
  ctx.save(); ctx.translate(W / 2, H * 0.11 + 64); ctx.rotate(0.03); ctx.translate(-W / 2, -H * 0.11 - 64);
  title('הכביש', H * 0.11 + 64, 66);
  ctx.restore();
  ctx.restore();
  const car = CARS[save.car] || CARS[0];
  const cy = H * 0.41;
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.35;
  blit(glowSprite('#fff6d0'), W / 2, cy, 0, 2.6);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  blit(vehicleSprite(car.style, car.body, car.stripe), W / 2, cy + Math.sin(t * 2) * 4, Math.sin(t * 1.3) * 0.06, 2.3);
  button(W / 2, H * 0.6, 236, 70, 'שחק!', '#2dbd5a', '#17803a', startRun, 36);
  button(W / 2, H * 0.6 + 88, 236, 56, 'המוסך', '#2a7de1', '#1a4f94', () => { state = 'garage'; }, 26);
  const py = H * 0.6 + 150;
  ctx.fillStyle = 'rgba(10,16,30,.55)'; rr(W / 2 - 118, py, 236, 70, 18); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 1.5; ctx.stroke();
  text('השיא שלי', W / 2 + 58, py + 22, 15, '#c9d6e3');
  text(String(save.best), W / 2 + 58, py + 48, 26, '#ffd60a');
  text('מטבעות', W / 2 - 58, py + 22, 15, '#c9d6e3');
  blit(coinSprite(), W / 2 - 80, py + 48, 0, 0.8);
  text(String(save.coins), W / 2 - 66, py + 49, 24, '#ffe066', null, 'left');
  soundButton();
}

function soundButton() {
  ctx.fillStyle = 'rgba(10,16,30,.55)'; rr(10, 10, 44, 44, 14); ctx.fill();
  text(save.mute ? '🔇' : '🔊', 32, 33, 22, '#fff');
  ui.push({ x: 10, y: 10, w: 44, h: 44, fn: () => { save.mute = !save.mute; persist(); audioInit(); if (save.mute) engineSet(false, 0); } });
}

function drawGarage() {
  drawWorld(demoDist, false);
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, 'rgba(10,18,40,.92)'); bg.addColorStop(1, 'rgba(20,10,40,.88)');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  title('המוסך', 44, 44);
  ctx.fillStyle = 'rgba(255,255,255,.08)'; rr(W / 2 - 50, 72, 100, 34, 17); ctx.fill();
  blit(coinSprite(), W / 2 - 26, 89, 0, 0.85);
  text(String(save.coins), W / 2 - 10, 90, 22, '#ffe066', null, 'left');
  const top = 118, bottom = H - 92;
  const rowH = Math.min(160, (bottom - top) / 3);
  CARS.forEach((c, i) => {
    const col = i % 2, row = (i / 2) | 0;
    const cx = W / 2 + (col === 0 ? 86 : -86), cy = top + row * rowH + rowH / 2;
    const owned = save.owned.includes(i), sel = save.car === i;
    const x0 = cx - 80, y0 = cy - rowH / 2 + 5, cw = 160, ch = rowH - 10;
    const g = ctx.createLinearGradient(0, y0, 0, y0 + ch);
    g.addColorStop(0, sel ? 'rgba(45,189,90,.35)' : 'rgba(255,255,255,.12)'); g.addColorStop(1, sel ? 'rgba(45,189,90,.12)' : 'rgba(255,255,255,.04)');
    ctx.fillStyle = g; rr(x0, y0, cw, ch, 18); ctx.fill();
    ctx.lineWidth = sel ? 3.5 : 1.5; ctx.strokeStyle = sel ? '#5cff8d' : 'rgba(255,255,255,.18)'; ctx.stroke();
    const sc = Math.min(1.45, (ch - 40) / 60);
    blit(vehicleSprite(c.style, c.body, c.stripe), cx, cy - 12, sel ? Math.sin(t * 2) * 0.08 : 0, sc);
    if (!owned) { ctx.fillStyle = 'rgba(5,8,20,.55)'; rr(x0, y0, cw, ch, 18); ctx.fill(); text('🔒', cx, cy - 14, 26, '#fff'); }
    const ly = y0 + ch - 18;
    if (sel) text('נבחרה', cx, ly, 17, '#7CFC00', OUT);
    else if (owned) text(c.name, cx, ly, 17, '#fff', OUT);
    else {
      blit(coinSprite(), cx + 16, ly, 0, 0.7);
      text(String(c.price), cx + 4, ly + 1, 18, save.coins >= c.price ? '#ffe066' : '#ff8fa3', OUT, 'right');
    }
    ui.push({ x: x0, y: y0, w: cw, h: ch, fn: () => {
      audioInit();
      if (owned) { save.car = i; persist(); blip(600, 800, 0.1, 'square', 0.05); }
      else if (save.coins >= c.price) {
        save.coins -= c.price; save.owned.push(i); save.car = i; persist();
        coinSound(); blip(500, 1000, 0.3, 'square', 0.06);
        burst(cx, cy, '#ffd60a', 20, 160, 'star');
      } else { garageMsg = 1.4; blip(160, 110, 0.2, 'square', 0.06); buzz(60); }
    } });
  });
  drawParts();
  if (garageMsg > 0) text('אין מספיק מטבעות, תאספו עוד!', W / 2, bottom + 6, 17, '#ff8fa3', OUT);
  button(W / 2, H - 46, 200, 52, 'חזרה', '#6c757d', '#41474d', () => { state = 'menu'; }, 24);
}

function drawOver() {
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H * 0.44;
  const k = clamp(overT * 4, 0, 1);
  ctx.save(); ctx.translate(cx, cy); ctx.scale(0.8 + 0.2 * k, 0.8 + 0.2 * k); ctx.globalAlpha = k;
  if (newBest) {
    ctx.save(); ctx.rotate(t * 0.5);
    ctx.fillStyle = 'rgba(255,214,10,.13)';
    for (let i = 0; i < 12; i++) { ctx.rotate(0.5236); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-22, -260); ctx.lineTo(22, -260); ctx.closePath(); ctx.fill(); }
    ctx.restore();
  }
  const g = ctx.createLinearGradient(0, -175, 0, 210);
  g.addColorStop(0, '#24365a'); g.addColorStop(1, '#141d33');
  ctx.fillStyle = g; rr(-140, -175, 280, 385, 26); ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = '#ffd60a'; ctx.stroke();
  text('נגמר המשחק', 0, -138, 30, '#fff');
  const sg = ctx.createLinearGradient(0, -110, 0, -55); sg.addColorStop(0, '#fff6b0'); sg.addColorStop(1, '#ff9f1c');
  text(String(score), 0, -82, 64, sg, { w: 7, c: '#6b2300' });
  text('נקודות', 0, -40, 17, '#9fb3c8');
  if (newBest) text('שיא חדש!', 0, -6, 28, '#ff9f1c', { w: 5, c: 'rgba(0,0,0,.4)' });
  else { text('השיא שלי', 0, -14, 15, '#9fb3c8'); text(String(save.best), 0, 8, 24, '#fff'); }
  blit(coinSprite(), -22, 40, 0, 0.9);
  text(String(coinsRun), -6, 41, 24, '#ffe066', null, 'left');
  ctx.restore(); ctx.globalAlpha = 1;
  if (overT > 0.7) {
    button(cx, cy + 92, 224, 56, 'שחק שוב', '#2dbd5a', '#17803a', startRun, 26);
    button(cx, cy + 156, 224, 46, 'תפריט', '#6c757d', '#41474d', () => { state = 'menu'; demoDist = dist; }, 22);
  }
}

function drawConfetti() {
  for (const c of confetti) {
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r);
    ctx.fillStyle = c.c; ctx.fillRect(-c.s / 2, -c.s / 4, c.s, c.s / 2);
    ctx.restore();
  }
}

function render() {
  ctx.fillStyle = '#0d150d'; ctx.fillRect(0, 0, W, H);
  if (state === 'menu') return drawMenu();
  if (state === 'garage') return drawGarage();
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 22, (Math.random() - 0.5) * shake * 22);
  drawWorld(dist, true);
  ctx.restore();
  if (state === 'over') { drawOver(); drawConfetti(); return; }
  drawHud();
  drawCountdown();
  if (state === 'paused') {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H);
    text('הפסקה', W / 2, H * 0.42, 54, '#fff', OUT);
    text('לוחצים כדי להמשיך', W / 2, H * 0.42 + 56, 22, '#ffd60a', OUT);
  }
}

// ---------- input ----------
let dragId = null, lastX = 0, pressedAt = null;
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  audioInit();
  const p = toLogical(e);
  if (state === 'paused') { state = 'play'; countdown = 1.2; lastTick = 2; return; }
  if (state === 'play') { dragId = e.pointerId; lastX = p.x; try { cv.setPointerCapture(e.pointerId); } catch (err) {} }
  else pressedAt = p;
});
cv.addEventListener('pointermove', e => {
  if (state !== 'play' || e.pointerId !== dragId) return;
  const p = toLogical(e);
  tx = clamp(tx + (p.x - lastX) * 1.5, 16, W - 16);
  lastX = p.x;
});
cv.addEventListener('pointerup', e => {
  pressedAt = null;
  if (e.pointerId === dragId) dragId = null;
  if (state === 'play' || state === 'paused') return;
  const p = toLogical(e);
  for (let i = ui.length - 1; i >= 0; i--) {
    const b = ui[i];
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { b.fn(); break; }
  }
});
cv.addEventListener('pointercancel', e => { pressedAt = null; if (e.pointerId === dragId) dragId = null; });
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  else if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  else if ((e.key === ' ' || e.key === 'Enter') && (state === 'menu' || (state === 'over' && overT > 0.7))) startRun();
  else if (e.key === 'Escape' && state === 'play') state = 'paused';
  audioInit();
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  else if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (state === 'play') state = 'paused'; engineSet(false, 0); }
});

// ---------- loop ----------
let last = performance.now();
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000) || 0.016;
  last = ts;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  ui = [];
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// small hook so the screens can be checked without playing (used by the screenshot test)
window.__g = {
  set(s) { state = s; if (s === 'over') { dist = 4200; coinsRun = 7; score = 118; newBest = true; overT = 1; } },
  warp(m) { dist = m * 50; demoDist = dist; nextRow = dist + 400; nextCoin = dist + 500; nextBolt = dist + 600; traffic = []; coins = []; bolts = []; lastBiome = biomeAt(dist); nextMilestone = Math.ceil(m / 250) * 250 + 250; },
  get state() { return state; },
};
})();
</script>
