<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kart Rush">
<title>Kart Rush</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0b1020;
    --panel: rgba(12, 18, 40, .84);
    --line: rgba(255, 255, 255, .16);
    --gold: #ffd60a;
    --green: #2dd36f;
    --red: #ff3b5c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: #fff;
    font-family: 'Nunito', system-ui, sans-serif;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .chip {
    background: var(--panel); border: 1.5px solid var(--line); border-radius: 16px;
    box-shadow: 0 6px 18px rgba(0,0,0,.25);
  }
  #dbg { position: fixed; top: 50%; left: 8px; transform: translateY(-50%); z-index: 9; font: 700 12px monospace; background: rgba(0,0,0,.6); padding: 4px 8px; border-radius: 8px; pointer-events: none; white-space: pre; }
  .opts { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; }
  .opt { padding: 7px 14px; font-size: 13px; }
  .opt.sel { background: rgba(255,214,10,.2); border-color: var(--gold); }
  .hud-pos { position: absolute; top: max(10px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); padding: 4px 16px 6px; text-align: center; }
  .hud-pos .big { font-family: 'Lilita One', sans-serif; font-size: 46px; line-height: 1; color: var(--gold); text-shadow: 0 3px 0 #8a4b00; }
  .hud-pos .big sup { font-size: 22px; vertical-align: top; margin-left: 2px; }
  .hud-pos .of { font-size: 13px; opacity: .8; letter-spacing: .08em; }
  .hud-mid { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); padding: 6px 18px; text-align: center; }
  .hud-mid .lap { font-family: 'Lilita One', sans-serif; font-size: 24px; letter-spacing: .04em; }
  .hud-mid .time { font-size: 16px; font-variant-numeric: tabular-nums; opacity: .9; }
  .hud-map { position: absolute; top: max(10px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); padding: 6px; }
  .hud-map canvas { width: 116px; height: 116px; display: block; }
  #pauseBtn {
    position: absolute; top: max(10px, env(safe-area-inset-top)); right: calc(max(12px, env(safe-area-inset-right)) + 140px);
    width: 44px; height: 44px; pointer-events: auto; font-family: 'Lilita One', sans-serif; font-size: 20px;
  }
  .banner {
    position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%);
    font-family: 'Lilita One', sans-serif; font-size: 92px; color: var(--gold);
    text-shadow: 0 6px 0 #8a4b00, 0 10px 30px rgba(0,0,0,.5); white-space: nowrap;
  }
  .banner.pop { animation: pop .9s ease-out both; }
  @keyframes pop { 0% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; } 30% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
  .toast {
    position: absolute; top: 22%; left: 50%; transform: translateX(-50%);
    font-family: 'Lilita One', sans-serif; font-size: 30px; padding: 6px 22px; white-space: nowrap;
  }
  #wrong { color: var(--red); }
  #lapToast { color: #fff; }
  #boostFx {
    position: absolute; inset: 0; opacity: 0; transition: opacity .25s;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(76, 201, 240, .35) 100%);
  }

  /* ---------- touch controls ---------- */
  #controls { position: fixed; inset: 0; pointer-events: none; }
  #wheel {
    position: absolute; left: max(18px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom));
    width: 156px; height: 156px; pointer-events: auto; touch-action: none;
  }
  #wheel svg { width: 100%; height: 100%; filter: drop-shadow(0 8px 12px rgba(0,0,0,.45)); }
  .pedals {
    position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom));
    display: flex; gap: 14px; align-items: flex-end; pointer-events: auto;
  }
  .pedal {
    position: relative; border-radius: 18px; touch-action: none;
    display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px;
    font-family: 'Lilita One', sans-serif; font-size: 17px; letter-spacing: .06em; color: rgba(255,255,255,.95);
    text-shadow: 0 2px 0 rgba(0,0,0,.35);
    box-shadow: 0 8px 0 rgba(0,0,0,.35), 0 12px 24px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.35);
    transition: transform .06s, box-shadow .06s, filter .06s;
  }
  .pedal::before {
    content: ''; position: absolute; left: 12px; right: 12px; top: 12px; bottom: 38px; border-radius: 10px;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 5px, rgba(255,255,255,.08) 5px 13px);
  }
  .pedal.on { transform: translateY(6px) scale(.97); box-shadow: 0 2px 0 rgba(0,0,0,.35), 0 4px 10px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.35); filter: brightness(1.15); }
  #gas { width: 84px; height: 150px; background: linear-gradient(#6ff59a, #19a04b); }
  #brake { width: 92px; height: 104px; background: linear-gradient(#ff8a9b, #c8193a); }
  .speedo {
    position: absolute; bottom: max(16px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    padding: 4px 16px; text-align: center; font-variant-numeric: tabular-nums;
  }
  .speedo b { font-family: 'Lilita One', sans-serif; font-size: 30px; font-weight: 400; }
  .speedo small { font-size: 12px; opacity: .75; margin-left: 3px; }

  /* ---------- screens ---------- */
  .screen {
    position: fixed; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;
    display: flex; align-items: center; justify-content: center;
    padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .menu-wrap { width: 100%; max-width: 900px; display: grid; gap: 14px; grid-template-columns: 1fr; align-items: center; margin: auto; }
  @media (orientation: landscape) and (min-width: 640px) { .menu-wrap { grid-template-columns: 0.9fr 1.1fr; } }
  .logo {
    font-family: 'Lilita One', sans-serif; font-weight: 400; margin: 0; line-height: .9; text-align: center;
    font-size: clamp(54px, 13vw, 104px); color: var(--gold); transform: rotate(-4deg);
    text-shadow: 0 5px 0 #b45309, 0 9px 0 #7c2d12, 0 16px 30px rgba(0,0,0,.45);
  }
  .logo span { display: block; color: #fff; text-shadow: 0 5px 0 #1e40af, 0 9px 0 #1e1b4b, 0 16px 30px rgba(0,0,0,.45); }
  .sub { text-align: center; font-weight: 900; opacity: .85; margin-top: 14px; font-size: 15px; }
  .panel { padding: 14px; }
  .label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; margin: 2px 4px 8px; font-weight: 900; }
  .tracks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .track {
    padding: 6px 6px 8px; border-radius: 14px; background: rgba(255,255,255,.07); border: 2px solid transparent; text-align: center;
  }
  .track.sel { border-color: var(--gold); background: rgba(255,214,10,.14); }
  .track canvas { width: 100%; aspect-ratio: 16/10; display: block; border-radius: 10px; }
  .track .nm { font-weight: 900; font-size: 13px; margin-top: 5px; line-height: 1.15; }
  .track .bt { font-size: 11px; opacity: .75; margin-top: 2px; min-height: 14px; }
  .colors { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 14px; }
  .sw { width: 40px; height: 40px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); box-shadow: inset 0 -5px 0 rgba(0,0,0,.25); }
  .sw.sel { border-color: #fff; transform: scale(1.12); box-shadow: 0 0 0 3px var(--gold), inset 0 -5px 0 rgba(0,0,0,.25); }
  .big-btn {
    display: block; width: 100%; padding: 14px 10px 16px; border-radius: 20px;
    font-family: 'Lilita One', sans-serif; font-size: 34px; letter-spacing: .05em;
    background: linear-gradient(#5ef08a, #18a148); color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.25);
    box-shadow: 0 7px 0 #0d6b2e, 0 14px 26px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.45);
  }
  .big-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #0d6b2e, inset 0 2px 0 rgba(255,255,255,.45); }
  .btn2 {
    display: inline-block; padding: 10px 18px; border-radius: 16px; font-weight: 900; font-size: 16px;
    background: rgba(255,255,255,.12); border: 1.5px solid var(--line);
  }
  .row { display: flex; gap: 10px; justify-content: center; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .link { color: #bfe3ff; font-weight: 900; font-size: 14px; text-decoration: none; }
  .tip { text-align: center; font-size: 13px; opacity: .75; margin-top: 10px; }
  @media (orientation: landscape) { .tip.rot { display: none; } }

  .finish-card { width: min(520px, 100%); padding: 18px 18px 16px; text-align: center; margin: auto; }
  .place { font-family: 'Lilita One', sans-serif; font-size: 64px; line-height: 1; color: var(--gold); text-shadow: 0 5px 0 #8a4b00; }
  .trophy { font-size: 54px; line-height: 1; }
  .newrec { display: inline-block; margin-top: 6px; background: var(--red); padding: 3px 12px; border-radius: 999px; font-weight: 900; font-size: 14px; }
  .results { margin: 12px 0 4px; display: grid; gap: 5px; }
  .res { display: grid; grid-template-columns: 34px 18px 1fr auto; gap: 8px; align-items: center; padding: 6px 12px; border-radius: 12px; background: rgba(255,255,255,.06); font-weight: 900; text-align: left; }
  .res.me { background: rgba(255,214,10,.2); outline: 2px solid var(--gold); }
  .res .dot { width: 16px; height: 16px; border-radius: 50%; }
  .res .tm { font-variant-numeric: tabular-nums; opacity: .85; }
  .pause-card { padding: 22px; text-align: center; min-width: 260px; }
  .pause-card h2 { font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 46px; margin: 0 0 12px; }
  #muteBtn { position: fixed; bottom: max(12px, env(safe-area-inset-bottom)); left: max(12px, env(safe-area-inset-left)); width: 46px; height: 46px; font-size: 22px; z-index: 5; }

  @media (max-height: 430px) {
    #wheel { width: 132px; height: 132px; }
    #gas { height: 128px; width: 76px; }
    #brake { height: 90px; width: 82px; }
    .hud-pos .big { font-size: 38px; }
    .hud-map canvas { width: 96px; height: 96px; }
    #pauseBtn { right: calc(max(12px, env(safe-area-inset-right)) + 120px); }
    .finish-card { padding: 10px 14px; }
    .trophy { font-size: 30px; }
    .place { font-size: 40px; }
    .results { margin: 6px 0 2px; gap: 3px; }
    .res { padding: 3px 12px; font-size: 14px; }
    .row { margin-top: 8px; }
  }
  @media (orientation: portrait) {
    .banner { font-size: 72px; }
    #pauseBtn { top: calc(max(10px, env(safe-area-inset-top)) + 140px); right: max(12px, env(safe-area-inset-right)); }
  }
</style>

</script>

<body>
<canvas id="gl"></canvas>

<div id="hud" class="hidden">
  <div class="hud-pos chip"><div class="big" id="pos">1<sup>st</sup></div><div class="of" id="posOf">OF 6</div></div>
  <div class="hud-mid chip"><div class="lap" id="lap">LAP 1/3</div><div class="time" id="time">0:00.0</div></div>
  <div class="hud-map chip"><canvas id="map" width="232" height="232"></canvas></div>
  <button id="pauseBtn" class="chip">II</button>
  <div id="boostFx"></div>
  <div id="banner" class="banner hidden"></div>
  <div id="lapToast" class="toast chip hidden"></div>
  <div id="wrong" class="toast chip hidden">WRONG WAY!</div>
</div>

<div id="controls" class="hidden">
  <div id="wheel">
    <svg viewBox="-100 -100 200 200" id="wheelSvg">
      <defs>
        <linearGradient id="rimG" x1="0" y1="-1" x2="0" y2="1">
          <stop offset="0" stop-color="#4a5266"/><stop offset="1" stop-color="#1b1f2b"/>
        </linearGradient>
        <radialGradient id="hubG" cx=".4" cy=".35" r=".8">
          <stop offset="0" stop-color="#ffe36a"/><stop offset="1" stop-color="#e08a00"/>
        </radialGradient>
      </defs>
      <circle r="84" fill="rgba(10,14,30,.35)"/>
      <circle r="84" fill="none" stroke="#0e1018" stroke-width="24"/>
      <circle r="84" fill="none" stroke="url(#rimG)" stroke-width="18"/>
      <path d="M-84 -14 A85 85 0 0 1 -60 -60" stroke="#ff3b5c" stroke-width="18" fill="none" opacity=".0"/>
      <rect x="-97" y="-22" width="22" height="44" rx="9" fill="#ff3b5c"/>
      <rect x="75" y="-22" width="22" height="44" rx="9" fill="#ff3b5c"/>
      <path d="M-76 6 L-24 10 L-24 -6 L-76 -10 Z" fill="#2a3042"/>
      <path d="M76 6 L24 10 L24 -6 L76 -10 Z" fill="#2a3042"/>
      <path d="M-10 24 L10 24 L14 76 L-14 76 Z" fill="#2a3042"/>
      <circle r="30" fill="#2a3042" stroke="#0e1018" stroke-width="4"/>
      <circle r="20" fill="url(#hubG)"/>
      <text y="7" text-anchor="middle" font-family="Lilita One, sans-serif" font-size="19" fill="#5a2a00">KR</text>
      <rect x="-6" y="-100" width="12" height="20" rx="4" fill="#ffd60a"/>
    </svg>
  </div>
  <div class="speedo chip"><b id="spd">0</b><small>km/h</small></div>
  <div class="pedals">
    <div id="brake" class="pedal">BRAKE</div>
    <div id="gas" class="pedal">GAS</div>
  </div>
</div>

<button id="muteBtn" class="chip">🔊</button>
<div id="dbg" class="hidden"></div>

<div id="menu" class="screen">
  <div class="menu-wrap">
    <div>
      <h1 class="logo">KART<span>RUSH</span></h1>
      <div class="sub">Race 5 karts. 3 laps. Be first!</div>
    </div>
    <div class="panel chip">
      <div class="label">Choose a track</div>
      <div class="tracks" id="tracks"></div>
      <div class="label">Choose your kart</div>
      <div class="colors" id="colors"></div>
      <div class="label">Difficulty</div>
      <div class="opts" id="diffs"></div>
      <div class="opts"><button class="btn2 opt" id="ecoBtn">🔋 Battery saver: OFF</button></div>
      <button class="big-btn" id="raceBtn">RACE!</button>
      <div class="tip rot">Tip: turn your phone sideways</div>
      <div class="row"><a class="link" href="classic/">Play the classic 2D Road Race</a></div>
    </div>
  </div>
</div>

<div id="finish" class="screen hidden">
  <div class="finish-card chip">
    <div class="trophy" id="trophy">🏆</div>
    <div class="place" id="place">1st</div>
    <div id="finishSub" style="font-weight:900;opacity:.85;margin-top:4px"></div>
    <div id="newrec" class="newrec hidden">NEW RECORD!</div>
    <div class="results" id="results"></div>
    <div class="row">
      <button class="big-btn" id="againBtn" style="width:auto;padding:10px 28px 12px;font-size:26px">RACE AGAIN</button>
      <button class="btn2" id="menuBtn">Menu</button>
    </div>
  </div>
</div>

<div id="pause" class="screen hidden">
  <div class="pause-card chip">
    <h2>PAUSED</h2>
    <button class="big-btn" id="resumeBtn" style="font-size:28px">RESUME</button>
    <div class="row"><button class="btn2" id="restartBtn">Restart</button><button class="btn2" id="quitBtn">Menu</button></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; };
const ord = n => n + ({ 1: 'st', 2: 'nd', 3: 'rd' }[n] || 'th');
const fmt = (s, hund) => {
  if (!isFinite(s)) return '--';
  const u = hund ? 100 : 10, n = Math.floor(s * u), m = Math.floor(n / (60 * u)), r = n % (60 * u), sec = Math.floor(r / u), f = r % u;
  return m + ':' + (sec < 10 ? '0' : '') + sec + '.' + (hund && f < 10 ? '0' : '') + f;
};

// ---------- save ----------
const SAVE_KEY = 'kart-rush.v1';
const save = { best: {}, bestLap: {}, medal: {}, color: 0, track: 0, mute: false, diff: 1, eco: false };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) {}
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };

// ---------- data ----------
const LAPS = 3;
const W2 = 7;                 // half track width (m)
const VMAX = 27, VBOOST = 36; // m/s
const TURN0 = 2.15, TURNF = 0.42; // steering rate (rad/s) and how much of it is lost at top speed
// AI difficulty: s = top-speed factor, cu = max catch-up boost when behind, err = seconds of lifting the gas per "mistake"
const DIFF = [
  { n: 'Easy', s: 0.88, cu: 0.08, err: 0.9 },
  { n: 'Normal', s: 0.94, cu: 0.12, err: 0.5 },
  { n: 'Hard', s: 1.0, cu: 0.2, err: 0.25 },
];
const COLORS = [
  { body: 0xe63946, suit: 0xffffff, css: '#e63946' },
  { body: 0x2a7de1, suit: 0xffd60a, css: '#2a7de1' },
  { body: 0x2dbd5a, suit: 0xffffff, css: '#2dbd5a' },
  { body: 0xffc300, suit: 0x1a1a1a, css: '#ffc300' },
  { body: 0x8e44ad, suit: 0xff9ff3, css: '#8e44ad' },
  { body: 0xff7f11, suit: 0x1d3557, css: '#ff7f11' },
  { body: 0xff5fa2, suit: 0xffffff, css: '#ff5fa2' },
  { body: 0x22d3ee, suit: 0x0b1020, css: '#22d3ee' },
];
const AI_NAMES = ['Max', 'Luna', 'Rex', 'Zoe', 'Bolt'];
const TRACKS = [
  { id: 'valley', name: 'Green Valley', ground: 'grass', scenery: 'trees',
    sky: ['#3d8bff', '#bfe3ff'], fog: 0xcfe7ff, hemi: [0xdff1ff, 0x4f8a3c], sun: 0xfff4e0, mountain: [0x5f8f6a, 0x7aa37f],
    pts: [[0, 0], [60, 0], [110, -10], [140, -50], [130, -100], [90, -120], [50, -100], [30, -60], [-10, -50], [-50, -80], [-90, -70], [-110, -20], [-90, 20], [-50, 30]] },
  { id: 'canyon', name: 'Sunset Canyon', ground: 'sand', scenery: 'desert',
    sky: ['#ff6a4d', '#ffc98b'], fog: 0xf7b98c, hemi: [0xffd9b0, 0xb2703d], sun: 0xffc48a, mountain: [0xb5552f, 0xd27a43],
    pts: [[0, 0], [80, 10], [130, 50], [120, 110], [60, 130], [20, 100], [-20, 130], [-80, 120], [-120, 70], [-100, 20], [-60, -10], [-30, -40], [10, -30]] },
  { id: 'snow', name: 'Snow Peak', ground: 'snow', scenery: 'pines',
    sky: ['#6aa6ff', '#eef6ff'], fog: 0xe8f1fb, hemi: [0xf0f7ff, 0xa9bdd3], sun: 0xffffff, mountain: [0x7f93ad, 0x9fb1c7],
    pts: [[0, 0], [70, -5], [120, 20], [130, 70], [100, 100], [60, 85], [30, 110], [-20, 120], [-70, 100], [-100, 50], [-80, 10], [-40, 15]] },
];

// ---------- renderer ----------
const canvas = $('gl');
const DPR = window.devicePixelRatio || 1;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: DPR < 2, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(DPR, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, 1, 0.5, 1600);
const hemi = new THREE.HemisphereLight(0xffffff, 0x445544, 1.6);
const sun = new THREE.DirectionalLight(0xffffff, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(768, 768);
Object.assign(sun.shadow.camera, { left: -32, right: 32, top: 32, bottom: -32, near: 1, far: 220 });
sun.shadow.bias = -0.0006;
scene.add(hemi, sun, sun.target);
const SUN_OFF = new THREE.Vector3(-45, 80, -30);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ---------- textures ----------
const ANISO = renderer.capabilities.getMaxAnisotropy();
function canvasTex(w, h, draw, rx, ry) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);

function makeKart() {
  const grp = new THREE.Group();

  add(KG.nose, bodyMat, 0, 0.36, 0.9);
  add(KG.bumper, M.dark, 0, 0.26, 1.16);
  add(KG.num, suitMat, 0, 0.4, 1.28);

  add(KG.strut, M.dark, -0.4, 0.68, -1.0);

// ---------- world (track + scenery) ----------
let world = null;

function disposeTree(o) {
  o.traverse(n => {
    if (n.geometry && !Object.values(KG).includes(n.geometry)) n.geometry.dispose();
    if (n.material) [].concat(n.material).forEach(m => { if (!Object.values(M).includes(m)) { if (m.map && ![asphaltTex, kerbTex, wallTex, checkerTex, padTex].includes(m.map)) m.map.dispose(); m.dispose(); } });
  });
}

function instanced(geo, mat, list, colorOf) {
  const m = new THREE.InstancedMesh(geo, mat, list.length);
  const d = new THREE.Object3D();
  list.forEach((it, i) => {
    d.position.set(it.x, it.y || 0, it.z);
    d.rotation.set(0, it.ry || 0, 0);
    if (it.sv) d.scale.set(it.sv[0], it.sv[1], it.sv[2]); else d.scale.setScalar(it.s || 1);
    d.updateMatrix();
    m.setMatrixAt(i, d.matrix);
    if (colorOf) m.setColorAt(i, colorOf(it, i));
  });
  m.instanceMatrix.needsUpdate = true;
  if (m.instanceColor) m.instanceColor.needsUpdate = true;
  return m;
}

function buildWorld(def) {
  if (world) { scene.remove(world.group); disposeTree(world.group); }
  const group = new THREE.Group();
  const S = 1.35;
  const curve = new THREE.CatmullRomCurve3(def.pts.map(p => new THREE.Vector3(p[0] * S, 0, p[1] * S)), true, 'centripetal');
  const N = Math.round(curve.getLength());
  const P = curve.getSpacedPoints(N); P.pop();
  const T = P.map((p, i) => new THREE.Vector3().subVectors(P[(i + 1) % N], P[(i - 1 + N) % N]).normalize());
  const R = T.map(t => new THREE.Vector3(-t.z, 0, t.x));
  const K = T.map((t, i) => { const u = T[(i + 8) % N]; return Math.atan2(t.x * u.z - t.z * u.x, t.x * u.x + t.z * u.z); });

  function ribbon(a, b, y, vs, mat, vertical) {
    const pos = [], uv = [], idx = [];

      const p = P[i % N], r = R[i % N], v = Dd[i] / vs;

      else { pos.push(p.x + r.x * a, y, p.z + r.z * a, p.x + r.x * b, y, p.z + r.z * b); uv.push(0, v, 1, v); }

    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));

    geo.computeVertexNormals();

    m.receiveShadow = true;
    group.add(m);
    return m;
  }
  const lam = (opts) => new THREE.MeshLambertMaterial(Object.assign({ side: THREE.DoubleSide }, opts));

  // ground
  let cx = 0, cz = 0; P.forEach(p => { cx += p.x; cz += p.z; }); cx /= N; cz /= N;
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(2400, 2400), lam({ map: canvasTex(256, 256, GROUND[def.ground], 300) }));
  ground.rotation.x = -Math.PI / 2; ground.position.set(cx, 0, cz); ground.receiveShadow = true;
  group.add(ground);

  // track surfaces
  const off = f => ({ polygonOffset: true, polygonOffsetFactor: f, polygonOffsetUnits: f });
  ribbon(-W2 - 4.6, W2 + 4.6, 0.02, 8, lam(Object.assign({ color: SHOULDER[def.ground] }, off(-1))));
  ribbon(-W2, W2, 0.05, 14, lam(Object.assign({ map: asphaltTex }, off(-3))));
  ribbon(-W2 - 1.4, -W2, 0.06, 3, lam(Object.assign({ map: kerbTex }, off(-4))));
  ribbon(W2, W2 + 1.4, 0.06, 3, lam(Object.assign({ map: kerbTex }, off(-4))));
  const wallMat = lam({ map: wallTex });

  }

  const line = new THREE.Mesh(new THREE.PlaneGeometry(W2 * 2, 2.2), lam(Object.assign({ map: checkerTex }, off(-5))));
  line.rotation.x = -Math.PI / 2; line.position.y = 0.07; start.add(line);
  const pillarMat = new THREE.MeshStandardMaterial({ color: 0xdfe3ea, roughness: 0.5, metalness: 0.3 });
  for (const s of [-1, 1]) {

  }

  beam.position.y = 7.2; start.add(beam);
  const bt = bannerTex('KART RUSH', '#ffd60a', '#1d2333');
  for (const s of [-1, 1]) {
    const b = new THREE.Mesh(new THREE.PlaneGeometry(W2 * 2 + 10, 1.4), new THREE.MeshBasicMaterial({ map: bt }));
    b.position.set(0, 7.2, s * 0.42); b.rotation.y = s > 0 ? 0 : Math.PI; start.add(b);
  }
  const lights = [];
  for (let i = 0; i < 3; i++) {

    l.position.set((i - 1) * 1.3, 5.7, -0.1); start.add(l); lights.push(l);

  group.add(stand);
  const stepMat = new THREE.MeshStandardMaterial({ color: 0xcbd2dc, roughness: 0.8 });
  const crowd = [];
  for (let row = 0; row < 5; row++) {
    const st = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.9 + row * 0.9, 34), stepMat);

    for (let k = 0; k < 26; k++) crowd.push({ x: -row * 1.4, y: 0.9 + row * 0.9, z: -16 + k * 1.28 + Math.random() * 0.3, c: (Math.random() * 7) | 0 });
  }
  const roof = new THREE.Mesh(new THREE.BoxGeometry(9, 0.3, 36), new THREE.MeshStandardMaterial({ color: 0xe63946, roughness: 0.6 }));
  roof.position.set(-3.2, 7.8, 0); roof.castShadow = true; stand.add(roof);
  const crowdCols = [0xff595e, 0xffca3a, 0x8ac926, 0x1982c4, 0x6a4c93, 0xffffff, 0xff924c];
  const crowdMesh = instanced(new THREE.BoxGeometry(0.55, 0.75, 0.5).translate(0, 0.38, 0), new THREE.MeshLambertMaterial({ color: 0xffffff }), crowd, it => new THREE.Color(crowdCols[it.c]));
  stand.add(crowdMesh);
  const heads = instanced(new THREE.SphereGeometry(0.2, 8, 6).translate(0, 0.95, 0), new THREE.MeshLambertMaterial({ color: 0xf1c27d }), crowd);
  stand.add(heads);

  // boost pads on the straightest stretches
  const pads = [];
  const padMat = new THREE.MeshBasicMaterial({ map: padTex, polygonOffset: true, polygonOffsetFactor: -6, polygonOffsetUnits: -6 });
  [0.2, 0.52, 0.8].forEach((f, n) => {
    let bi = Math.floor(N * f), bk = 9;
    for (let j = -40; j <= 40; j += 2) { const i = (Math.floor(N * f) + j + N) % N; const k = Math.abs(K[i]) + Math.abs(K[(i + 12) % N]); if (k < bk) { bk = k; bi = i; } }
    const lat = [-3, 3, 0][n];
    const pm = new THREE.Mesh(new THREE.PlaneGeometry(4, 5), padMat);
    pm.rotation.x = -Math.PI / 2;
    const pg = new THREE.Group(); pg.add(pm);
    pg.position.set(P[bi].x + R[bi].x * lat, 0.08, P[bi].z + R[bi].z * lat);
    pg.rotation.y = Math.atan2(T[bi].x, T[bi].z);
    group.add(pg);

  });

  // scenery
  const coarse = P.filter((_, i) => i % 4 === 0);
  const clear = (x, z, d) => coarse.every(p => (p.x - x) ** 2 + (p.z - z) ** 2 > d * d);
  const near = [];
  for (let n = 0; n < 900 && near.length < 340; n++) {
    const i = (Math.random() * N) | 0, s = Math.random() < 0.5 ? -1 : 1, o = s * (W2 + 9 + Math.random() * Math.random() * 70);
    const x = P[i].x + R[i].x * o + (Math.random() - 0.5) * 6, z = P[i].z + R[i].z * o + (Math.random() - 0.5) * 6;
    if (clear(x, z, W2 + 8)) near.push({ x, z, s: 0.75 + Math.random() * 0.7, ry: Math.random() * 6.28, v: Math.random() });
  }
  if (def.scenery === 'trees') {
    const trunk = new THREE.CylinderGeometry(0.22, 0.32, 2.2, 7).translate(0, 1.1, 0);
    const crown = new THREE.IcosahedronGeometry(1.9, 0).translate(0, 3.4, 0);
    const crown2 = new THREE.IcosahedronGeometry(1.3, 0).translate(0.6, 4.6, 0.2);
    const pal = [0x3f9a3a, 0x2f7d34, 0x5cb247, 0xe08a2e, 0xf28fb8];

    const cm = new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true });
    group.add(instanced(crown, cm, near, it => new THREE.Color(pal[Math.floor(it.v * (it.v > 0.9 ? 5 : 3))])));
    group.add(instanced(crown2, cm, near, it => new THREE.Color(pal[Math.floor(it.v * (it.v > 0.9 ? 5 : 3))]).multiplyScalar(1.12)));
  } else if (def.scenery === 'desert') {

    group.add(instanced(new THREE.CylinderGeometry(0.28, 0.28, 1.6, 7).translate(0.95, 2.6, 0), cm, cact));
    group.add(instanced(new THREE.CylinderGeometry(0.28, 0.28, 0.9, 7).rotateZ(Math.PI / 2).translate(0.55, 1.85, 0), cm, cact));
    group.add(instanced(new THREE.CylinderGeometry(0.26, 0.26, 1.3, 7).translate(-0.9, 2.2, 0), cm, cact));
    group.add(instanced(new THREE.CylinderGeometry(0.26, 0.26, 0.8, 7).rotateZ(Math.PI / 2).translate(-0.5, 1.6, 0), cm, cact));

    const pines = near.filter(it => it.v < 0.9), men = near.filter(it => it.v >= 0.9);
    const pm = new THREE.MeshLambertMaterial({ color: 0x24613f, flatShading: true });
    group.add(instanced(new THREE.CylinderGeometry(0.2, 0.28, 1.4, 6).translate(0, 0.7, 0), new THREE.MeshLambertMaterial({ color: 0x6b4a2b }), pines));
    group.add(instanced(new THREE.ConeGeometry(2.0, 3.2, 7).translate(0, 2.6, 0), pm, pines));
    group.add(instanced(new THREE.ConeGeometry(1.5, 2.6, 7).translate(0, 4.1, 0), pm, pines));
    group.add(instanced(new THREE.ConeGeometry(0.9, 1.7, 7).translate(0, 5.4, 0), new THREE.MeshLambertMaterial({ color: 0xf4f8fc, flatShading: true }), pines));

// ---------- race logic ----------
let state = 'menu';         // menu | countdown | race | finished | paused
let raceT = 0, cdT = 0, menuT = 0, finishT = 0, wrongT = 0, lastCd = 4;
const camLook = new THREE.Vector3();

function updateTrackPos(k) {
  const { N, P } = world;
  let best = k.idx, bd = Infinity;
  for (let j = -30; j <= 30; j++) {
    const i = (k.idx + j + N) % N, dx = P[i].x - k.x, dz = P[i].z - k.z, d = dx * dx + dz * dz;
    if (d < bd) { bd = d; best = i; }

  const prev = k.idx; k.idx = best;

  if (best > N * 0.4 && best < N * 0.6) k.half = true;
}
const progress = k => k.finished ? 1e9 - k.finishTime : k.lap * world.N + k.idx;

function onLap(k) {
  if (k.lap >= 1) k.laps.push(raceT - k.lapStart);
  k.lapStart = raceT;
  if (k.lap >= LAPS && !k.finished) {
    k.finished = true; k.finishTime = raceT;
    if (k.isPlayer) playerFinished();
  } else if (k.isPlayer && k.lap >= 1) {
    toast((k.lap === LAPS - 1 ? 'FINAL LAP!' : 'LAP ' + (k.lap + 1)) + '  ' + fmt(k.laps[k.laps.length - 1], true), 1.8);
    tone(880, 880, 0.12, 'square', 0.06); tone(1175, 1175, 0.2, 'square', 0.06, 0.12);

}

function drive(k, gas, brake, steer, dt) {
  const { P, R, T, pads, N } = world;
  k.steerS += (steer - k.steerS) * Math.min(1, dt * 9);
  const p = P[k.idx], r = R[k.idx];
  const lat = (k.x - p.x) * r.x + (k.z - p.z) * r.z;
  const a = Math.abs(lat);
  k.surface = a <= W2 ? 'road' : a <= W2 + 1.4 ? 'kerb' : 'grass';
  const grass = k.surface === 'grass';

  k.h -= k.steerS * turn * dt * Math.sign(k.v || 1);

  if (sp > 10) k.v -= Math.sign(k.v) * 7 * k.steerS * k.steerS * Math.min(1, (sp - 10) / 15) * dt;
  k.x += Math.sin(k.h) * k.v * dt;
  k.z += Math.cos(k.h) * k.v * dt;
  updateTrackPos(k);

  const p2 = P[k.idx], r2 = R[k.idx];

  if (Math.abs(lat2) > lim) {

    if (k.v > 0) { const th = Math.atan2(T[k.idx].x, T[k.idx].z); k.h += angDiff(th, k.h) * 0.25; }
    if (Math.abs(k.v) > 5 && k.bumpT <= 0) { k.v *= 0.6; k.bumpT = 0.4; if (k.isPlayer) { thud(); buzz(60); shake = 0.25; } }

    }

}

function aiControl(k, dt) {
  const { N, P, R, K } = world;
  const ai = k.ai, D = DIFF[save.diff];
  // rubber band: catch up when the player is ahead, ease off when far ahead of the player

  let skill = ai.skill;
  if (gap > 50) skill *= 1 + Math.min(D.cu, (gap - 50) / 800);
  if (gap < -30) skill *= 1 - Math.min(0.16, (-gap - 30) / 700);
  ai.skillNow = skill;
  // sharpest curvature within braking distance
  const sp = Math.max(0, k.v);
  let kA = 0;
  for (let j = 2, span = 6 + Math.ceil(sp * 1.1); j < span; j += 2) { const kk = K[(k.idx + j) % N]; if (Math.abs(kk) > Math.abs(kA)) kA = kk; }

  ai.phase += dt * 0.35;
  const w = clamp((Math.abs(kA) - 0.05) / 0.2, 0, 1) * 0.85;
  const base = ai.lane + Math.sin(ai.phase) * 0.8 * (1 - w);
  const lane = clamp(base + (Math.sign(kA) * (W2 - 2.2) - base) * w, -W2 + 1.5, W2 - 1.5);
  const ti = (k.idx + 10 + Math.floor(sp * 0.55)) % N;

  if (ai.err > 0) { ai.err -= dt; target *= 0.8; }

}

function collide() {

  const { P, N, map } = world, c = mapCtx, S = 232, pad = 22;
  const sc = Math.min((S - pad * 2) / (map.x1 - map.x0), (S - pad * 2) / (map.z1 - map.z0));

function showResults() {

  rows.sort((a, b) => a.t - b.t);

  $('trophy').textContent = pos === 1 ? '🏆' : pos === 2 ? '🥈' : pos === 3 ? '🥉' : '🏁';
  $('place').textContent = ord(pos) + (pos === 1 ? ' PLACE!' : ' place');
  $('finishSub').textContent = 'Time ' + fmt(total, true) + '   Best lap ' + fmt(bestLap, true);
  $('newrec').classList.toggle('hidden', !rec);
  $('results').innerHTML = rows.map((r, i) =>
    '<div class="res' + (r.k === pl ? ' me' : '') + '"><span>' + ord(i + 1) + '</span><span class="dot" style="background:' + COLORS[r.k.color].css + '"></span><span>' +
    r.k.name + '</span><span class="tm">' + (r.k.finished ? fmt(r.t, true) : '+ ' + fmt(r.t - rows[0].t, false)) + '</span></div>').join('');
  show('controls', false); show('hud', false); show('finish', true); show('muteBtn', true);
}
function pauseGame() { if (state !== 'race' && state !== 'countdown') return; pausedFrom = state; state = 'paused'; show('pause', true); engine(false, 0); }
let pausedFrom = 'race';
// quality: battery saver = screen resolution 1x, no shadow map (soft blob under each kart instead)
function applyQuality() {
  const eco = !!save.eco;
  renderer.setPixelRatio(Math.min(DPR, eco ? 1 : 1.5));
  renderer.shadowMap.enabled = !eco; sun.castShadow = !eco;
  karts.forEach(k => { k.blob.visible = eco; });
  scene.traverse(o => { if (o.material) [].concat(o.material).forEach(m => { m.needsUpdate = true; }); });
  resize();
}
$('ecoBtn').onclick = () => { audioInit(); save.eco = !save.eco; persist(); applyQuality(); renderMenu(); tone(660, 880, 0.08, 'square', 0.05); };
function toMenu() {
  state = 'menu'; show('hud', false); show('controls', false); show('finish', false); show('pause', false); show('menu', true); show('muteBtn', true);
  buildWorld(TRACKS[save.track]); placeGrid(); renderMenu(); engine(false, 0);
}
$('raceBtn').onclick = startRace;
$('againBtn').onclick = startRace;
$('menuBtn').onclick = toMenu;
$('quitBtn').onclick = toMenu;
$('restartBtn').onclick = startRace;
$('resumeBtn').onclick = () => { state = pausedFrom; show('pause', false); };
$('pauseBtn').addEventListener('pointerdown', e => { e.preventDefault(); pauseGame(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

// ---------- menu ----------
function renderMenu() {
  const tr = $('tracks');
  tr.innerHTML = '';
  TRACKS.forEach((t, i) => {
    const d = document.createElement('button');
    d.className = 'track' + (i === save.track ? ' sel' : '');
    const cv = document.createElement('canvas'); cv.width = 160; cv.height = 100;
    const g = cv.getContext('2d');
    const bg = g.createLinearGradient(0, 0, 0, 100); bg.addColorStop(0, t.sky[0]); bg.addColorStop(1, t.sky[1]);
    g.fillStyle = bg; g.fillRect(0, 0, 160, 100);
    const pts = new THREE.CatmullRomCurve3(t.pts.map(p => new THREE.Vector3(p[0], 0, p[1])), true, 'centripetal').getPoints(120);
    let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9; pts.forEach(p => { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); z0 = Math.min(z0, p.z); z1 = Math.max(z1, p.z); });
    const s = Math.min(130 / (x1 - x0), 74 / (z1 - z0));
    g.beginPath(); pts.forEach(p => g.lineTo(80 + (-(p.x - (x0 + x1) / 2)) * s, 50 - (p.z - (z0 + z1) / 2) * s)); g.closePath();
    g.lineJoin = 'round'; g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 9; g.stroke(); g.strokeStyle = '#fff'; g.lineWidth = 5; g.stroke();
    d.appendChild(cv);
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = t.name; d.appendChild(nm);
    const bt = document.createElement('div'); bt.className = 'bt';
    const medal = { 1: '🏆 ', 2: '🥈 ', 3: '🥉 ' }[save.medal[t.id]] || '';
    bt.textContent = save.best[t.id] ? medal + fmt(save.best[t.id], true) : 'New!';
    d.appendChild(bt);
    d.onclick = () => { audioInit(); save.track = i; persist(); buildWorld(TRACKS[i]); placeGrid(); renderMenu(); tone(660, 880, 0.08, 'square', 0.05); };
    tr.appendChild(d);
  });
  const cs = $('colors');
  cs.innerHTML = '';
  COLORS.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'sw' + (i === save.color ? ' sel' : '');
    b.style.background = c.css;
    b.setAttribute('aria-label', 'Kart color ' + (i + 1));
    b.onclick = () => { audioInit(); save.color = i; persist(); placeGrid(); renderMenu(); tone(880, 1100, 0.08, 'square', 0.05); };
    cs.appendChild(b);
  });
  const df = $('diffs');
  df.innerHTML = '';
  DIFF.forEach((d, i) => {
    const b = document.createElement('button');
    b.className = 'btn2 opt' + (i === save.diff ? ' sel' : '');
    b.textContent = d.n;
    b.onclick = () => { audioInit(); save.diff = i; persist(); placeGrid(); renderMenu(); tone(660, 880, 0.08, 'square', 0.05); };
    df.appendChild(b);
  });
  $('ecoBtn').textContent = '🔋 Battery saver: ' + (save.eco ? 'ON' : 'OFF');
  $('ecoBtn').classList.toggle('sel', !!save.eco);
}

// ---------- loop ----------
let last = performance.now(), lastRender = 0, dbgN = 0, dbgT = 0, dbgMs = 0;
const dbgOn = location.search.includes('debug');
if (dbgOn) $('dbg').classList.remove('hidden');
function frame(now) {
  requestAnimationFrame(frame);
  // frame cap: 60 in a race, 30 in the menu (90/120 Hz screens otherwise burn battery for nothing)
  if (now - lastRender < 1000 / (state === 'menu' ? 30 : 60) - 1.5) return;
  const dt = Math.min(0.05, (now - last) / 1000) || 0.016;
  last = now; lastRender = now;
  // nothing moves behind the pause and results screens: keep the last picture, skip the work
  if (state === 'paused' || (state === 'finished' && !$('finish').classList.contains('hidden'))) return;
  const pl = player();
  padTex.offset.y = (padTex.offset.y + dt * 1.6) % 1;

  if (state === 'menu') {
    menuT += dt;
    const { P } = world, c = P[0];
    camera.position.set(c.x + Math.sin(menuT * 0.15) * 26, 8 + Math.sin(menuT * 0.3) * 1.5, c.z + Math.cos(menuT * 0.15) * 26);
    camLook.set(pl.x, 1.2, pl.z);
    camera.lookAt(camLook);
  } else if (state === 'countdown' || state === 'race' || state === 'finished') {
    if (state === 'countdown') {
      cdT += dt;
      const n = Math.floor(cdT);
      if (n !== lastCd && n < 3) {
        lastCd = n; world.lights[n].material.color.set(0xff2030);
        tone(440, 440, 0.18, 'square', 0.07); banner(String(3 - n));
      }
      if (cdT >= 3) {
        state = 'race'; world.lights.forEach(l => l.material.color.set(0x22ff66));
        tone(880, 880, 0.4, 'square', 0.08); banner('GO!');
        setTimeout(() => { if (state === 'race') $('banner').classList.add('hidden'); }, 900);
      }
      engine(true, input.gas ? 18 : 0, false);
    } else {
      raceT += dt;
      const steer = clamp(wheelTouch + (input.keyR ? 1 : 0) - (input.keyL ? 1 : 0), -1, 1);
      if (state === 'race') drive(pl, input.gas || input.keyUp, input.brake || input.keyDown, steer, dt);
      else { pl.ai = pl.ai || { skill: 0.9, skillNow: 0.9, lane: 0, phase: 0, mt: 1e9, err: 0 }; aiControl(pl, dt); }
      for (let i = 1; i < karts.length; i++) aiControl(karts[i], dt);
      collide();
      engine(true, pl.v, pl.boost > 0);
      if (state === 'finished') { finishT += dt; if (finishT > 2.6 && $('finish').classList.contains('hidden')) showResults(); }
    }
    karts.forEach(k => syncMesh(k, dt));
    updateHud(dt);
    // chase camera
    const fx = Math.sin(pl.h), fz = Math.cos(pl.h);
    const back = 6.4 + Math.abs(pl.v) * 0.035, up = 2.7;
    const tx = pl.x - fx * back, tz = pl.z - fz * back;
    const kk = 1 - Math.exp(-dt * 6);
    camera.position.x += (tx - camera.position.x) * kk;
    camera.position.z += (tz - camera.position.z) * kk;
    camera.position.y += (up - camera.position.y) * kk;
    camLook.lerp(new THREE.Vector3(pl.x + fx * 5, 1.1, pl.z + fz * 5), 1 - Math.exp(-dt * 10));
    if (shake > 0) { shake -= dt; camera.position.x += (Math.random() - 0.5) * shake; camera.position.y += (Math.random() - 0.5) * shake; }
    if (pl.surface === 'kerb' && Math.abs(pl.v) > 8) camera.position.y += (Math.random() - 0.5) * 0.05;
    camera.lookAt(camLook);
    const baseFov = camera.aspect < 1 ? 78 : 62;
    camera.fov += ((baseFov + (pl.boost > 0 ? 10 : 0) + Math.abs(pl.v) * 0.12) - camera.fov) * Math.min(1, dt * 4);
    camera.updateProjectionMatrix();
  }
  sun.target.position.set(pl.x, 0, pl.z);
  sun.position.copy(sun.target.position).add(SUN_OFF);
  const t0 = dbgOn ? performance.now() : 0;
  renderer.render(scene, camera);
  if (dbgOn) {
    dbgN++; dbgT += dt; dbgMs += performance.now() - t0;
    if (dbgT >= 0.5) {
      $('dbg').textContent = Math.round(dbgN / dbgT) + ' fps\n' + (dbgMs / dbgN).toFixed(1) + ' ms render\n' + renderer.info.render.calls + ' calls\ndpr ' + renderer.getPixelRatio().toFixed(2) + (save.eco ? ' eco' : '');
      dbgN = 0; dbgT = 0; dbgMs = 0;
    }
  }
}

buildWorld(TRACKS[save.track]);
placeGrid();
applyQuality();
renderMenu();
requestAnimationFrame(frame);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (state === 'menu') { buildWorld(TRACKS[save.track]); placeGrid(); } });

// hook for the automated screenshot test
window.__k = { get state() { return state; }, start: startRace, skip() { cdT = 3; }, finish() { const p = player(); p.lap = LAPS - 1; p.idx = world.N - 3; p.half = true; p.laps = [31.2, 30.4]; }, karts, input,
  // balance check: the player driven as a perfect, mistake-free AI at full speed; returns the standings after `sec` seconds
  sim(sec) {
    const pl = player(), h = 1 / 60;
    pl.ai = pl.ai || { skill: 1, skillNow: 1, lane: 0, phase: 0, mt: 1e9, err: 0 };
    for (let i = 0; i < sec * 60; i++) { raceT += h; karts.forEach(k => aiControl(k, h)); collide(); }
    return karts.map(k => ({ n: k.name, lap: k.lap, idx: k.idx, fin: +k.finishTime.toFixed(1), laps: k.laps.map(t => +t.toFixed(1)) }));
  } };
</script>
</body>
