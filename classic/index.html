function resize() {
  const iw = window.innerWidth, ih = window.innerHeight;
  const cw = Math.min(iw, ih * 0.62), ch = ih;
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width = cw + 'px';
  cv.style.height = ch + 'px';
  cv.width = Math.round(cw * dpr);
  cv.height = Math.round(ch * dpr);
  scale = cw / W;
  H = ch / scale;
  PLAYER_Y = H * 0.76;
  lightC.width = Math.ceil(W / 2);
  lightC.height = Math.ceil(H / 2);
  vignette = document.createElement('canvas');
  vignette.width = W; vignette.height = Math.ceil(H);

  g.addColorStop(1, 'rgba(0,0,0,.42)');

}

  const prev = Array.isArray(save.stars) ? save.stars : [];
  save.stars = Array.from({ length: STAGES.length }, (_, i) => Math.max(0, Math.min(3, prev[i] | 0)));
}

// ---------- sound ----------
let ac = null, eng = null, engGain = null;
function audioInit() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    eng = ac.createOscillator();
    eng.type = 'sawtooth';
    engGain = ac.createGain();
    engGain.gain.value = 0;
    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 420;
    eng.connect(lp); lp.connect(engGain); engGain.connect(ac.destination);
    eng.start();
  } catch (e) { ac = null; }
}
function engineSet(on, spd) {
  if (!ac) return;
  engGain.gain.setTargetAtTime(on && !save.mute ? 0.045 : 0, ac.currentTime, 0.12);
  eng.frequency.setTargetAtTime(48 + spd * 0.13, ac.currentTime, 0.12);
}

  if (!ac || save.mute) return;
  const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
  o.type = type || 'square';
  o.frequency.setValueAtTime(f1, n);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), n + dur);
  g.gain.setValueAtTime(vol || 0.07, n);
  g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(n); o.stop(n + dur + 0.02);
}
function crashSound() {
  if (!ac || save.mute) return;
  const len = Math.floor(ac.sampleRate * 0.35), buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = ac.createBufferSource(), g = ac.createGain();
  s.buffer = buf; g.gain.value = 0.25;
  s.connect(g); g.connect(ac.destination); s.start();
}

// ---------- helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mod = (a, n) => ((a % n) + n) % n;
const hash = n => { n = (n * 374761393 + 668265263) | 0; n = (n ^ (n >>> 13)) * 1274126177 | 0; return (n ^ (n >>> 16)) >>> 0; };
const stageBiomeLock = () => activeStage && (state === 'play' || state === 'paused' || state === 'stageCard' || state === 'stageOver');
const biomeAt = D => stageBiomeLock() ? activeStage.world : mod(Math.floor(D / ZONE), 4);
const HEB = /[֐-׿]/;

function sharpWeightAt(d) {
  if (stageBiomeLock()) {
    if (activeStage.mech.includes('sharpCurves')) return 1;
    return forcedSharpD !== null ? clamp((d - forcedSharpD) / 300, 0, 1) : 0;
  }
  if (state === 'play' || state === 'paused' || state === 'over') {
    if (forcedSharpD !== null && d >= forcedSharpD) return clamp((d - forcedSharpD) / 300, 0, 1);
    const i = Math.floor(d / ZONE), b = mod(i, 4), s = d - i * ZONE;
    if (b === 2) {
      if (s < 10000) return 0;
      if (s < 12000) return (s - 10000) / 2000;
      if (s > 28500) return (30000 - s) / 1500;
      return 1;
    }
  }
  return 0;
}
function curve(d) {
  const base = 32 * Math.sin(d / 260) + 18 * Math.sin(d / 140 + 1.3);
  const sw = sharpWeightAt(d);
  if (sw <= 0) return base;
  return base + sw * (22 * Math.sin(d / 125) + 14 * Math.cos(d / 85));
}
function curveSlope(d) {
  return (curve(d + 8) - curve(d - 8)) / 16;
}

function rgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function shade(hex, a) {
  const c = rgb(hex), t = a < 0 ? 0 : 255, p = Math.abs(a);
  return 'rgb(' + c.map(v => Math.round(v + (t - v) * p)).join(',') + ')';
}
function alpha(hex, a) { return 'rgba(' + rgb(hex).join(',') + ',' + a + ')'; }
function rng(seed) { return () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296; }

function biomeWeights(D) {
  const w = [0, 0, 0, 0];
  if (stageBiomeLock()) { w[activeStage.world] = 1; return w; }
  const i = Math.floor(D / ZONE), s = D - i * ZONE, cur = mod(i, 4), T = 1800;
  if (s < T && i > 0) { w[cur] = s / T; w[mod(i - 1, 4)] += 1 - s / T; } else w[cur] = 1;
  return w;
}

function rr(x, y, w, h, r, g) {
  g = g || ctx;
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function poly(g, pts) { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); }
function circle(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, 6.2832); }

function text(s, x, y, size, fill, stroke, align) {
  ctx.direction = HEB.test(s) ? 'rtl' : 'ltr';
  ctx.font = '900 ' + size + 'px system-ui,"Segoe UI",Arial,sans-serif';
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = stroke.w; ctx.strokeStyle = stroke.c; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill;
  ctx.fillText(s, x, y);
}

function heart(x, y, s, fill, line) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.9);
  ctx.bezierCurveTo(x - s * 1.7, y - s * 0.2, x - s * 0.7, y - s * 1.3, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.7, y - s * 1.3, x + s * 1.7, y - s * 0.2, x, y + s * 0.9);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (line) { ctx.lineWidth = 2; ctx.strokeStyle = line; ctx.stroke(); }
}

function drawStar(x, y, r, fill, line, lw) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rad = i % 2 ? r * 0.45 : r;
    if (i === 0) ctx.moveTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
    else ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (line) { ctx.lineWidth = lw || 1.6; ctx.strokeStyle = line; ctx.lineJoin = 'round'; ctx.stroke(); }
}

function drawCrown(x, y, s, fill, line) {

    free = usable.filter(l => !lanes.includes(l));

    const car = { lane: l, D, type, w: d[0], h: d[1], color, spr: vehicleSprite(type, color, null), rot: 0 };
    if (lcOn && lanes.length === 1 && (type === 'sedan' || type === 'van') && free.length >= 2 && Math.random() < lcProb) {
      const dirs = [-1, 1].filter(dir => {
        const nl = l + dir;

  if (narrows.some(n => D < n.D1 + 500 && D + 2100 > n.D0 - 500)) return false;
  const finishD = activeStage ? activeStage.length * 50 : Infinity;
  const len = Math.min(1500 + Math.random() * 500, finishD - D - 260);
  if (len < 650) return false;
  const side = hasMech('oncoming') ? 1 : (Math.random() < 0.5 ? -1 : 1);
  const closed = side < 0 ? 0 : 3;
  narrows.push({ D0: D, D1: D + len, side });
  traffic = traffic.filter(c => !(Math.round(c.lane) === closed && c.D >= D - 220 && c.D <= D + len + 220));
  coins = coins.filter(c => !(c.lane === closed && c.D >= D - 180 && c.D <= D + len + 180));
  hazards = hazards.filter(h => !(h.lane === closed && h.D >= D - 200 && h.D <= D + len + 200));
  return true;
}
function spawnHazard(kind, D, forcedLane) {
  const usable = usableLanesAt(D, 200);
  if (usable.length <= 1 && kind === 'cones') return false;
  let candidates = usable.filter(l => {
    if (kind === 'cones') {
      if (traffic.some(c => Math.round(c.lane) === l && Math.abs(c.D - D) < 200)) return false;
      const others = usable.filter(o => o !== l && !traffic.some(c => Math.round(c.lane) === o && Math.abs(c.D - D) < 160));
      if (!others.length) return false;
      if (prevFree && !others.some(o => prevFree.includes(o))) return false;
    } else {
      if (hazards.some(h => h.lane === l && Math.abs(h.D - D) < 130)) return false;
      if (kind === 'pothole' && traffic.some(c => Math.round(c.lane) === l && Math.abs(c.D - D) < 100)) return false;
    }
    return true;
  });
  if (forcedLane != null && usable.includes(forcedLane)) candidates = [forcedLane];
  if (!candidates.length) return false;
  const lane = candidates[(Math.random() * candidates.length) | 0];
  if (kind === 'cones') {
    hazards.push({ kind: 'cones', lane, D, D1: D + 96, warnD: D - 140, cones: [{ D, smashed: false }, { D: D + 48, smashed: false }, { D: D + 96, smashed: false }] });
    coins = coins.filter(c => !(c.lane === lane && c.D >= D - 60 && c.D <= D + 140));

}
function burst(x, y, color, n, power, kind) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.2832, p = (0.3 + Math.random()) * power;
    parts.push({ x, y, vx: Math.cos(a) * p, vy: Math.sin(a) * p, life: 0.5 + Math.random() * 0.4, max: 0.9, color, size: 2 + Math.random() * 3, kind: kind || 'sq' });
  }
}

// ---------- update ----------
function steer(dt) {
  if (keys.left) tx -= 430 * dt;
  if (keys.right) tx += 430 * dt;
  tx = clamp(tx, 16, W - 16);
  const sw = sharpWeightAt(dist);
  if (sw > 0 && countdown <= 0) {
    const drift = curveSlope(dist) * speed * 0.08 * sw;
    px = clamp(px - drift * dt, 16, W - 16);
    tx = clamp(tx - drift * dt * 0.45, 16, W - 16);
  }
  if (iceT > 0) {
    const wantVx = (tx - px) * 3.2;
    vxIce += (wantVx - vxIce) * Math.min(1, dt * 3.5);
    px += vxIce * dt;
  } else {
    vxIce *= Math.pow(0.05, dt);
    px += (tx - px) * Math.min(1, dt * 11);
  }
  px = clamp(px, 16, W - 16);
}

function damagePlayer(x, y) {
  if (invuln > 0) return;
  lives--; crashes++;
  invuln = 1.7; shake = 0.4; flash = 0.25;
  speed *= 0.45;
  burst(x, y, '#ffb703', 14, 140);
  for (let i = 0; i < 5; i++) parts.push({ x, y, vx: (Math.random() - 0.5) * 60, vy: speed * 0.3 + Math.random() * 40, life: 0.9, max: 0.9, color: '#6b7078', size: 9, kind: 'puff' });
  crashSound(); buzz(180);
  if (lives <= 0) endRun();
}

function hit(car) {
  const x = carX(car.lane, car.D, dist), y = screenY(car.D, dist);
  traffic.splice(traffic.indexOf(car), 1);
  if (nitro > 0) {
    smashes++;
    burst(x, y, car.color, 16, 170);
    burst(x, y, '#ffd166', 10, 120);
    for (let i = 0; i < 6; i++) parts.push({ x, y, vx: (Math.random() - 0.5) * 80, vy: (Math.random() - 0.5) * 80 + speed * 0.3, life: 0.8, max: 0.8, color: '#9aa0a8', size: 10, kind: 'puff' });
    blip(300, 80, 0.2, 'sawtooth', 0.09);
    showPopup('בום!');
    return;
  }
  damagePlayer(x, y);
}

function updatePlay(dt) {
  steer(dt);
  if (countdown > 0) {
    countdown -= dt;
    const c = Math.ceil(countdown);
    if (c !== lastTick && c > 0) { lastTick = c; blip(520, 520, 0.12, 'square', 0.05); }
    if (countdown <= 0) { goFlash = 0.8; blip(780, 1040, 0.25, 'square', 0.07); }
    return;
  }
  goFlash = Math.max(0, goFlash - dt);
  if (activeStage) stageTime += dt;
  const sf = activeStage ? activeStage.speedFactor : 1;
  const td = activeStage ? activeStage.traffic : 1;
  const finishD = activeStage ? activeStage.length * 50 : Infinity;
  const base = activeStage ? (320 * sf + Math.min(60, dist / 400)) : (320 + Math.min(280, dist / 90));

  const nNow = narrowAt(dist, 0);
  const closedOff = nNow ? (nNow.side < 0 ? px < W / 2 - HALF + LANE - 2 : px > W / 2 + HALF - LANE + 2) : false;
  offroad = Math.abs(px - W / 2) > HALF + 6 || closedOff;

  onSand = false;
  for (const h of hazards) {
    const x = carX(h.lane, h.D, dist), y = screenY(h.D, dist);
    if (h.kind === 'sand' && Math.abs(x - px) < 26 && Math.abs(y - PLAYER_Y) < 44) onSand = true;
    else if (h.kind === 'ice' && Math.abs(x - px) < 28 && Math.abs(y - PLAYER_Y) < 52) {
      if (iceT <= 0.1 && !popup) showPopup('קרח!', 'הזהרו מהחלקה');
      iceT = 0.85;
    } else if (h.kind === 'pothole' && !h.hit && Math.abs(x - px) < 20 && Math.abs(y - PLAYER_Y) < 22) {
      h.hit = true;
      if (nitro <= 0) {
        speed *= 0.62; shake = Math.max(shake, 0.2);
        blip(140, 75, 0.14, 'triangle', 0.06);
        burst(x, y, '#4a4e58', 8, 90);
        if (!popup) showPopup('בור!', 'איבדת מהירות');
      }
    } else if (h.kind === 'cones') {
      for (const cn of h.cones) {
        if (cn.smashed) continue;
        const cx = carX(h.lane, cn.D, dist), cy = screenY(cn.D, dist);
        if (Math.abs(cx - px) < 20 && Math.abs(cy - PLAYER_Y) < 24) {
          cn.smashed = true;
          if (nitro > 0) {
            burst(cx, cy, '#ff6d00', 12, 140);
            blip(280, 90, 0.15, 'sawtooth', 0.07);
          } else {
            damagePlayer(cx, cy);
            if (state !== 'play') return;
          }
        }
      }
    }
  }

  const slowMul = (offroad && nitro <= 0) ? 0.55 : (onSand && nitro <= 0 ? 0.58 : 1);
  const target = base * (nitro > 0 ? 1.5 : 1) * slowMul;
  speed += (target - speed) * Math.min(1, dt * (target < speed ? 3 : 1.4));
  dist += speed * dt;
  invuln = Math.max(0, invuln - dt);
  nitro = Math.max(0, nitro - dt);
  iceT = Math.max(0, iceT - dt);
  shake = Math.max(0, shake - dt);
  flash = Math.max(0, flash - dt);
  if (popup && (popup.life -= dt) <= 0) popup = null;

  if (activeStage && dist >= finishD) { finishStage(); return; }

  const horizon = Math.min(dist + PLAYER_Y + 160, finishD - 140);
  while (nextRow < horizon) {
    spawnRow(nextRow);
    const gap = activeStage ? Math.max(195, (350 / td) - dist / 400) : Math.max(230, 360 - dist / 120);
    nextRow += gap * (0.85 + Math.random() * 0.4);
  }
  while (nextCoin < horizon) { spawnCoins(nextCoin); nextCoin += 420 + Math.random() * 500; }
  while (nextBolt < horizon - 120) {
    spawnBolt(nextBolt);
    nextBolt += activeStage ? (2100 + Math.random() * 1200) : (2600 + Math.random() * 1800);
  }

  if (hasMech('narrow')) {
    while (nextNarrow < horizon - 500) {
      spawnNarrow(nextNarrow + 260);
      nextNarrow += (3200 / Math.max(0.85, td)) + Math.random() * 1400;
    }
  } else nextNarrow = Math.max(nextNarrow, dist + 1400);

  if (hasMech('oncoming')) {
    while (nextOncoming < horizon + 120) {
      spawnOncoming(nextOncoming);
      nextOncoming += Math.max(760, 1250 / td) + Math.random() * 650;
    }
  } else nextOncoming = Math.max(nextOncoming, dist + 900);

  const hazKinds = ['sand', 'cones', 'ice', 'potholes'].filter(hasMech);
  if (hazKinds.length) {
    while (nextHazard < horizon - 120) {
      const k = hazKinds[(Math.random() * hazKinds.length) | 0];
      spawnHazard(k === 'potholes' ? 'pothole' : k, nextHazard);
      nextHazard += Math.max(360, 720 / Math.max(0.85, td)) + Math.random() * 480;
    }
  } else nextHazard = Math.max(nextHazard, dist + 700);

  const ts = base * 0.42;
  for (const c of traffic) {
    if (c.oncoming) { c.D -= ts * 0.85 * dt; continue; }
    c.D += ts * dt;
    if (c.shiftDir) {
      if (!c.triggered && c.D - dist <= 480 && c.D - dist > 100) c.triggered = true;
      if (c.triggered) {
        if (c.blinkT > 0) c.blinkT -= dt;
        else if (c.moveT < 1) {
          c.moveT = Math.min(1, c.moveT + dt / 0.45);
          const ease = c.moveT * c.moveT * (3 - 2 * c.moveT);
          c.lane = c.fromLane + c.shiftDir * ease;
          c.rot = c.shiftDir * 0.16 * Math.sin(c.moveT * Math.PI);
          if (c.moveT >= 1) { c.lane = c.targetLane; c.rot = 0; c.shiftDir = 0; }
        }
      }
    }
  }
  traffic = traffic.filter(c => screenY(c.D, dist) < H + 120 && c.D > dist - 300);
  coins = coins.filter(c => screenY(c.D, dist) < H + 40);
  bolts = bolts.filter(c => screenY(c.D, dist) < H + 40);
  hazards = hazards.filter(h => screenY(h.D1 || h.D, dist) < H + 180);
  narrows = narrows.filter(n => screenY(n.D1, dist) < H + 260);

  for (const c of traffic.slice()) {
    const x = carX(c.lane, c.D, dist), y = screenY(c.D, dist);
    if (Math.abs(x - px) < (c.w + PW) / 2 * 0.78 && Math.abs(y - PLAYER_Y) < (c.h + PH) / 2 * 0.85) { hit(c); if (state !== 'play') return; }
  }
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i], x = carX(c.lane, c.D, dist), y = screenY(c.D, dist);
    if (Math.abs(x - px) < 22 && Math.abs(y - PLAYER_Y) < 32) {
      coins.splice(i, 1); coinsRun++; save.coins++; persist(); coinSound();
      burst(x, y, '#ffe066', 6, 90, 'star');
    }
  }
  for (let i = bolts.length - 1; i >= 0; i--) {
    const c = bolts[i], x = carX(c.lane, c.D, dist), y = screenY(c.D, dist);
    if (Math.abs(x - px) < 24 && Math.abs(y - PLAYER_Y) < 34) {
      bolts.splice(i, 1); nitro = 3.2; showPopup('טורבו!');
      burst(x, y, '#4cc9f0', 14, 140, 'star');
      blip(300, 1200, 0.4, 'sawtooth', 0.08); buzz(60);
    }
  }
  if (!activeStage) {
    const b = biomeAt(dist);
    if (b !== lastBiome) { lastBiome = b; showPopup(BIOME_NAMES[b], 'עולם חדש'); }
    const m = Math.floor(dist / 50);
    if (m >= nextMilestone) { if (!popup) showPopup(String(m), 'מטר'); nextMilestone += 250; }
  }

  if ((offroad || onSand) && nitro <= 0 && Math.random() < dt * 30) {
    const dc = onSand ? '#e2bd73' : ['#8a6a3a', '#d9b56e', '#ffffff', '#5a4a30'][biomeAt(dist)];
    parts.push({ x: px + (Math.random() - 0.5) * 20, y: PLAYER_Y + 20, vx: (Math.random() - 0.5) * 50, vy: speed * 0.35, life: 0.6, max: 0.6, color: dc, size: 7, kind: 'puff' });
  }
  if (iceT > 0 && Math.random() < dt * 24) {
    parts.push({ x: px + (Math.random() - 0.5) * 18, y: PLAYER_Y + 20, vx: (Math.random() - 0.5) * 35, vy: speed * 0.3, life: 0.4, max: 0.4, color: '#b8f2ff', size: 3.5, kind: 'sq' });
  }
  if (nitro > 0) {
    parts.push({ x: px + (Math.random() - 0.5) * 10, y: PLAYER_Y + 24, vx: (Math.random() - 0.5) * 30, vy: 260 + Math.random() * 120, life: 0.3, max: 0.3, color: Math.random() < 0.5 ? '#ffb703' : '#ff6b35', size: 3 + Math.random() * 3, kind: 'sq' });
  }
  engineSet(true, speed);
}

function update(dt) {
  t += dt;
  if (state === 'menu' || state === 'map' || state === 'stageCard' || state === 'garage') demoDist += 260 * dt;
  else if (state === 'play') updatePlay(dt);
  else if (state === 'over' || state === 'stageOver') {
    overT += dt;
    speed *= Math.pow(0.15, dt);
    dist += speed * dt;
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (const c of confetti) { c.x += c.vx * dt; c.y += c.vy * dt; c.r += c.vr * dt; c.vx += Math.sin(t * 3 + c.s) * 20 * dt; }
  confetti = confetti.filter(c => c.y < H + 20);
  const fs = state === 'play' ? speed : 260;
  for (const f of flakes) {
    f.y += (25 + f.r * 18 + fs * 0.25) * dt;
    f.x += Math.sin(t * 1.5 + f.s * 9) * 14 * dt;
    if (f.y > H + 5) { f.y = -5; f.x = Math.random() * W; }
  }
  garageMsg = Math.max(0, garageMsg - dt);
  mapMsg = Math.max(0, mapMsg - dt);
}

// ---------- drawing: world ----------
function drawGround(vd) {
  const Dtop = vd + PLAYER_Y, Dbot = vd - (H - PLAYER_Y);
  const bTop = biomeAt(Dtop), bBot = biomeAt(Dbot);
  const region = (b, y0, y1) => {
    if (y1 <= y0) return;
    ctx.fillStyle = BIOMES[b].ground; ctx.fillRect(0, y0, W, y1 - y0);
    ctx.save(); ctx.beginPath(); ctx.rect(0, y0, W, y1 - y0); ctx.clip();
    fillTex(groundTex[b], TEX, vd);
    ctx.restore();
  };
  if (bTop === bBot) region(bBot, 0, H);
  else {
    const yb = screenY(Math.floor(Dtop / ZONE) * ZONE, vd);
    region(bTop, 0, yb); region(bBot, yb, H);
    let g = ctx.createLinearGradient(0, yb - 90, 0, yb);
    g.addColorStop(0, alpha(BIOMES[bBot].ground, 0)); g.addColorStop(1, alpha(BIOMES[bBot].ground, 0.85));
    ctx.fillStyle = g; ctx.fillRect(0, yb - 90, W, 90);
    g = ctx.createLinearGradient(0, yb, 0, yb + 90);
    g.addColorStop(0, alpha(BIOMES[bTop].ground, 0.85)); g.addColorStop(1, alpha(BIOMES[bTop].ground, 0));
    ctx.fillStyle = g; ctx.fillRect(0, yb, W, 90);
  }
  for (let j = Math.floor(Dbot / 120); j <= Math.floor(Dtop / 120); j++) {
    if (!(j & 1)) continue;
    ctx.fillStyle = BIOMES[biomeAt(j * 120)].band;
    ctx.fillRect(0, screenY(j * 120 + 120, vd), W, 120);
  }
}

function drawRoad(vd) {
  const cvd = curve(vd), STEP = 10;
  const Dtop = vd + PLAYER_Y + 20, Dbot = vd - (H - PLAYER_Y) - 20;
  const ex = (D, off) => W / 2 + curve(D) - cvd + off;
  const pts = [];
  for (let D = Dtop; D > Dbot - STEP; D -= STEP) pts.push([screenY(D, vd), W / 2 + curve(D) - cvd]);
  const band = (a, b) => {
    ctx.beginPath();
    for (const p of pts) ctx.lineTo(p[1] + a, p[0]);
    for (let i = pts.length - 1; i >= 0; i--) ctx.lineTo(pts[i][1] + b, pts[i][0]);
    ctx.closePath();
  };
  const line = off => { ctx.beginPath(); for (const p of pts) ctx.lineTo(p[1] + off, p[0]); };

  ctx.fillStyle = 'rgba(0,0,0,.18)'; band(-HALF - 22, HALF + 22); ctx.fill();
  ctx.fillStyle = '#f2f2f2'; band(-HALF - 12, HALF + 12); ctx.fill();
  ctx.fillStyle = '#e63946'; ctx.beginPath();
  const KB = 36;
  for (let j = Math.floor(Dbot / KB); j <= Math.floor(Dtop / KB); j++) {
    if (j & 1) continue;
    const D0 = j * KB, D1 = D0 + KB, Dm = D0 + KB / 2;
    for (const s of [-1, 1]) {
      const o = s * (HALF + 12), i = s * HALF;
      ctx.moveTo(ex(D0, o), screenY(D0, vd)); ctx.lineTo(ex(Dm, o), screenY(Dm, vd)); ctx.lineTo(ex(D1, o), screenY(D1, vd));
      ctx.lineTo(ex(D1, i), screenY(D1, vd)); ctx.lineTo(ex(Dm, i), screenY(Dm, vd)); ctx.lineTo(ex(D0, i), screenY(D0, vd)); ctx.closePath();
    }
  }
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1.5;
  line(-HALF - 12); ctx.stroke(); line(HALF + 12); ctx.stroke();

  band(-HALF, HALF);
  const ag = ctx.createLinearGradient(W / 2 - HALF - 50, 0, W / 2 + HALF + 50, 0);
  ag.addColorStop(0, '#30343b'); ag.addColorStop(0.5, '#41464f'); ag.addColorStop(1, '#30343b');
  ctx.fillStyle = ag; ctx.fill();
  ctx.save(); ctx.clip();
  fillTex(asphaltTex, 128, vd);
  ctx.strokeStyle = 'rgba(0,0,0,.09)'; ctx.lineWidth = 20;
  for (let i = 0; i < 4; i++) { line((i - 1.5) * LANE); ctx.stroke(); }
  ctx.restore();
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 3;
  line(-HALF + 1.5); ctx.stroke(); line(HALF - 1.5); ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2.5;
  line(-HALF + 8); ctx.stroke(); line(HALF - 8); ctx.stroke();

  const isGame = state === 'play' || state === 'paused' || state === 'over' || state === 'stageOver';
  const showOncoming = isGame && hasMech('oncoming');

  ctx.strokeStyle = 'rgba(255,255,255,.88)'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  ctx.beginPath();
  const DL = 64;
  for (let j = Math.floor(Dbot / DL); j <= Math.floor(Dtop / DL); j++) {
    if (j & 1) continue;
    const D0 = j * DL, D1 = D0 + DL * 0.6, Dm = (D0 + D1) / 2;
    for (let i = 1; i < 4; i++) {
      if (i === 1 && showOncoming) continue;
      const o = (i - 2) * LANE;
      ctx.moveTo(ex(D0, o), screenY(D0, vd)); ctx.lineTo(ex(Dm, o), screenY(Dm, vd)); ctx.lineTo(ex(D1, o), screenY(D1, vd));
    }
  }
  ctx.stroke(); ctx.lineCap = 'butt';

  if (showOncoming) {
    // Yellow double dashed divider between oncoming lane 0 and lane 1
    ctx.strokeStyle = '#ffd60a'; ctx.lineWidth = 2.6;
    ctx.beginPath();
    for (let j = Math.floor(Dbot / DL); j <= Math.floor(Dtop / DL); j++) {
      if (j & 1) continue;
      const D0 = j * DL, D1 = D0 + DL * 0.65, Dm = (D0 + D1) / 2;
      for (const dx of [-3.5, 3.5]) {
        ctx.moveTo(ex(D0, -LANE + dx), screenY(D0, vd));
        ctx.lineTo(ex(Dm, -LANE + dx), screenY(Dm, vd));
        ctx.lineTo(ex(D1, -LANE + dx), screenY(D1, vd));
      }
    }
    ctx.stroke();
    // Yellow downward arrows in lane 0
    ctx.fillStyle = 'rgba(255, 214, 10, 0.55)';
    const AL = 190;
    for (let j = Math.floor(Dbot / AL); j <= Math.floor(Dtop / AL); j++) {
      const D = j * AL + 40;
      if (D < Dbot || D > Dtop) continue;
      const ax = ex(D, -1.5 * LANE), ay = screenY(D, vd);
      poly(ctx, [[ax, ay + 14], [ax - 10, ay - 2], [ax - 4, ay - 2], [ax - 4, ay - 14], [ax + 4, ay - 14], [ax + 4, ay - 2], [ax + 10, ay - 2]]);
      ctx.fill();
    }
  }

  if (isGame && narrows.length) {
    const cSpr = coneSprite();
    for (const n of narrows) {
      if (n.D1 < Dbot - 120 || n.D0 > Dtop + 320) continue;
      const a = n.side < 0 ? -HALF + 6 : LANE;
      const b = n.side < 0 ? -LANE : HALF - 6;
      const d0 = Math.max(Dbot, n.D0), d1 = Math.min(Dtop, n.D1);
      if (d1 > d0) {
        ctx.fillStyle = 'rgba(34, 30, 26, 0.86)';
        ctx.beginPath();
        for (let D = d1; D >= d0; D -= 16) ctx.lineTo(ex(D, a), screenY(D, vd));
        ctx.lineTo(ex(d0, a), screenY(d0, vd));
        for (let D = d0; D <= d1; D += 16) ctx.lineTo(ex(D, b), screenY(D, vd));
        ctx.lineTo(ex(d1, b), screenY(d1, vd));
        ctx.closePath(); ctx.fill();

        ctx.fillStyle = 'rgba(255, 183, 3, 0.55)';
        ctx.beginPath();
        for (let j = Math.floor(d0 / 28); j <= Math.floor(d1 / 28); j++) {
          const sa = Math.max(d0, j * 28), sb = Math.min(d1, sa + 11);
          if (sb <= sa) continue;
          ctx.moveTo(ex(sa, a), screenY(sa, vd));
          ctx.lineTo(ex(sb, a), screenY(sb, vd));
          ctx.lineTo(ex(Math.min(d1, sb + 10), b), screenY(Math.min(d1, sb + 10), vd));
          ctx.lineTo(ex(Math.min(d1, sa + 10), b), screenY(Math.min(d1, sa + 10), vd));
          ctx.closePath();
        }
        ctx.fill();

        ctx.strokeStyle = '#ff9f1c'; ctx.lineWidth = 3;
        ctx.beginPath();
        for (let D = d0; D <= d1; D += 16) {
          const bx = ex(D, n.side * LANE), by = screenY(D, vd);
          if (D === d0) ctx.moveTo(bx, by); else ctx.lineTo(bx, by);
        }
        ctx.lineTo(ex(d1, n.side * LANE), screenY(d1, vd));
        ctx.stroke();

        for (let Dc = n.D0 + 24; Dc <= n.D1 - 16; Dc += 84) {
          if (Dc < Dbot || Dc > Dtop) continue;
          blit(cSpr, ex(Dc, n.side * (LANE + 10)), screenY(Dc, vd));
        }
      }
      // Entry taper cones
      for (const [dt, off] of [[-55, n.side * (HALF - 12)], [-25, n.side * (LANE + 24)]]) {
        const Dc = n.D0 + dt;
        if (Dc >= Dbot && Dc <= Dtop) blit(cSpr, ex(Dc, off), screenY(Dc, vd));
      }
      // Advance warning signs on shoulder
      const wSpr = signSprite(n.side < 0 ? 'narrowL' : 'narrowR');
      for (const dw of [n.D0 - 280, n.D0 - 110]) {
        if (dw >= Dbot && dw <= Dtop) blit(wSpr, ex(dw, n.side * (HALF + 22)), screenY(dw, vd));
      }
    }
  }

  if (isGame && sharpWeightAt(vd) > 0.2) {
    const SP = 180;
    for (let j = Math.floor(Dbot / SP); j <= Math.floor(Dtop / SP); j++) {
      const D = j * SP;
      const sl = curveSlope(D);
      if (Math.abs(sl) < 0.24) continue;
      const s = sl > 0 ? 1 : -1;
      const cSpr = signSprite(s > 0 ? 'curveR' : 'curveL');
      blit(cSpr, ex(D, -s * (HALF + 22)), screenY(D, vd));
    }
  }
}

function drawDecor(vd) {
  const cvd = curve(vd), SP = 70;
  lamps.length = 0;
  const k0 = Math.floor((vd - (H - PLAYER_Y) - 60) / SP), k1 = Math.floor((vd + PLAYER_Y + 60) / SP);
  for (let k = k0; k <= k1; k++) for (let s = -1; s <= 1; s += 2) {
    const h = hash(k * 2 + (s > 0 ? 1 : 0));
    const D = k * SP + (h % 40);
    const x = W / 2 + curve(D) - cvd + s * (HALF + 36 + (h % 60));
    const y = screenY(D, vd);
    if (x < -40 || x > W + 40) continue;
    const b = biomeAt(D), r = (h >>> 9) % 100, v = (h >>> 4);
    let spr = null;
    if (b === 0) spr = r < 55 ? treeSprite(v % 4) : r < 85 ? bushSprite(v % 3) : null;
    else if (b === 1) spr = r < 40 ? cactusSprite(v % 2) : r < 72 ? rockSprite(v % 3) : null;
    else if (b === 2) spr = r < 62 ? pineSprite(v % 3) : r < 72 ? snowmanSprite() : r < 90 ? rockSprite(v % 3, true) : null;
    else spr = r < 60 ? treeSprite(v % 2) : r < 80 ? bushSprite(v % 3) : null;
    if (spr) blit(spr, x, y);
  }
  const L = 200;
  for (let k = Math.floor((vd - (H - PLAYER_Y) - 40) / L); k <= Math.floor((vd + PLAYER_Y + 40) / L); k++) {
    const D = k * L;
    if (biomeAt(D) !== 3) continue;
    const s = (k & 1) ? 1 : -1;
    const x = W / 2 + curve(D) - cvd + s * (HALF + 22), y = screenY(D, vd);
    blit(lampSprite(s), x, y);
    lamps.push([x - s * 6, y]);
  }
}

function drawClouds(vd, a) {
  if (a <= 0.01) return;
  const CS = 520;
  ctx.globalAlpha = a;
  for (let k = Math.floor((vd - H) / CS); k <= Math.floor((vd + PLAYER_Y + 200) / CS); k++) {
    const h = hash(k * 7 + 3);
    blit(cloudSprite(), (h % 420) - 30, screenY(k * CS * 1.0, vd), 0, 1 + (h % 5) * 0.12);
  }
  ctx.globalAlpha = 1;
}

function drawObjects() {
  const cs = coinSprite();
  for (const h of hazards) {
    if (h.kind === 'sand') {
      const y = screenY(h.D, dist);
      if (y < -90 || y > H + 90) continue;
      blit(sandSprite(), carX(h.lane, h.D, dist), y);
    } else if (h.kind === 'ice') {
      const y = screenY(h.D, dist);
      if (y < -110 || y > H + 110) continue;
      blit(iceSprite(), carX(h.lane, h.D, dist), y);
    } else if (h.kind === 'pothole') {
      const y = screenY(h.D, dist);
      if (y < -40 || y > H + 40) continue;
      blit(potholeSprite(), carX(h.lane, h.D, dist), y);
    } else if (h.kind === 'cones') {
      const wy = screenY(h.warnD, dist);
      if (wy > -40 && wy < H + 40) {
        const wx = carX(h.lane, h.warnD, dist);
        blit(signSprite('works'), wx - 16, wy);
        ctx.fillStyle = Math.floor(t * 7) % 2 ? '#ff9f1c' : '#ffe066';
        circle(ctx, wx + 12, wy, 5); ctx.fill();
      }
      const cSpr = coneSprite();
      for (const cn of h.cones) {
        if (cn.smashed) continue;
        const cy = screenY(cn.D, dist);
        if (cy < -30 || cy > H + 30) continue;
        blit(cSpr, carX(h.lane, cn.D, dist), cy);
      }
    }
  }
  for (const c of coins) {
    const x = carX(c.lane, c.D, dist), y = screenY(c.D, dist);
    if (y < -20 || y > H + 20) continue;
    const sq = Math.cos(t * 5 + c.D * 0.05);
    blit(cs, x, y, 0, Math.max(0.15, Math.abs(sq)), 1);
  }
  for (const b of bolts) {
    const x = carX(b.lane, b.D, dist), y = screenY(b.D, dist);
    if (y < -30 || y > H + 30) continue;
    blit(boltSprite(), x, y, 0, 1 + Math.sin(t * 8) * 0.08);
  }
  for (const c of traffic) {
    const y = screenY(c.D, dist);
    if (y >= -70 && y <= H + 70) {
      const x = carX(c.lane, c.D, dist);
      blit(c.spr, x, y, c.oncoming ? Math.PI : (c.rot || 0));
      if (c.shiftDir && c.triggered && c.blinkT > 0 && Math.floor(t * 10) % 2) {
        const bx = x + c.shiftDir * (c.w / 2 + 1);
        ctx.fillStyle = '#ff9f1c';
        circle(ctx, bx, y - c.h / 2 + 5, 4); ctx.fill();
        circle(ctx, bx, y + c.h / 2 - 5, 4); ctx.fill();
        text(c.shiftDir > 0 ? '→' : '←', bx + c.shiftDir * 11, y, 12, '#ffd60a');
      }
    } else if (c.oncoming && y < -20 && y > -480 && (state === 'play' || state === 'paused')) {
      const ax = carX(c.lane, dist + PLAYER_Y, dist);
      const pulse = 0.65 + Math.sin(t * 14) * 0.35;
      ctx.save(); ctx.globalAlpha = pulse;
      ctx.fillStyle = 'rgba(255, 59, 48, .88)';
      rr(ax - 20, 52, 40, 22, 11); ctx.fill();
      ctx.strokeStyle = '#ffd60a'; ctx.lineWidth = 1.6; ctx.stroke();
      text('⚠ ↓', ax, 63, 12, '#ffffff');
      ctx.restore();
    }
  }
}

function drawPlayer() {
  if (invuln > 0 && nitro <= 0 && Math.floor(t * 14) % 2) return;
  const car = CARS[save.car] || CARS[0];
  if (iceT > 0) {
    ctx.save();
    ctx.strokeStyle = 'rgba(186, 242, 255, 0.72)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(px - 10, PLAYER_Y + 18); ctx.lineTo(px - 10 - vxIce * 0.04, PLAYER_Y + 42);
    ctx.moveTo(px + 10, PLAYER_Y + 18); ctx.lineTo(px + 10 - vxIce * 0.04, PLAYER_Y + 42);
    ctx.stroke();
    ctx.restore();
  }
  if (nitro > 0) {
    const fl = 16 + Math.random() * 14;
    const g = ctx.createLinearGradient(0, PLAYER_Y + 22, 0, PLAYER_Y + 22 + fl);
    g.addColorStop(0, '#fff3a0'); g.addColorStop(0.4, '#ffb703'); g.addColorStop(1, 'rgba(255,80,0,0)');
    ctx.fillStyle = g;
    for (const sx of [-6, 6]) { ctx.beginPath(); ctx.moveTo(px + sx - 4, PLAYER_Y + 21); ctx.lineTo(px + sx + 4, PLAYER_Y + 21); ctx.lineTo(px + sx, PLAYER_Y + 22 + fl); ctx.fill(); }
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.6;
    blit(glowSprite('#4cc9f0'), px, PLAYER_Y, 0, 1.4);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  }
  blit(vehicleSprite(car.style, car.body, car.stripe), px, PLAYER_Y, clamp((tx - px) * 0.012 + vxIce * 0.0005, -0.28, 0.28));
}

function drawParts() {
  for (const p of parts) {
    const k = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = p.kind === 'puff' ? k * 0.5 : k;
    ctx.fillStyle = p.color;
    if (p.kind === 'puff') { circle(ctx, p.x, p.y, p.size * (1.8 - k)); ctx.fill(); }
    else if (p.kind === 'star') { const s = p.size; poly(ctx, [[p.x, p.y - s], [p.x + s * 0.3, p.y - s * 0.3], [p.x + s, p.y], [p.x + s * 0.3, p.y + s * 0.3], [p.x, p.y + s], [p.x - s * 0.3, p.y + s * 0.3], [p.x - s, p.y], [p.x - s * 0.3, p.y - s * 0.3]]); ctx.fill(); }
    else ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawSpeedLines() {
  ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 2;
  for (let i = 0; i < 14; i++) {
    const x = (i * 53.7 + 11) % W, y = ((t * 1100 + i * 97) % (H + 90)) - 45;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 42); ctx.stroke();
  }
}

function drawSnow(a) {
  if (a <= 0.01) return;
  ctx.fillStyle = '#ffffff';
  for (const f of flakes) { ctx.globalAlpha = a * (0.5 + f.s * 0.5); circle(ctx, f.x, f.y % (H + 10), f.r); ctx.fill(); }
  ctx.globalAlpha = 1;
}

function cone(g, x, y, len, w0, w1, a, dir = -1) {
  const y1 = y + dir * len;
  const gr = g.createLinearGradient(0, y, 0, y1);
  gr.addColorStop(0, 'rgba(0,0,0,' + a + ')'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr;
  g.beginPath(); g.moveTo(x - w0, y); g.lineTo(x + w0, y); g.lineTo(x + w1, y1); g.lineTo(x - w1, y1); g.closePath(); g.fill();
}
function drawNight(a, game) {
  if (a <= 0.01) return;
  lg.setTransform(0.5, 0, 0, 0.5, 0, 0);
  lg.globalCompositeOperation = 'source-over';
  lg.clearRect(0, 0, W, H);
  lg.fillStyle = 'rgba(8,12,40,' + (0.72 * a) + ')';
  lg.fillRect(0, 0, W, H);
  lg.globalCompositeOperation = 'destination-out';
  for (const [x, y] of lamps) {
    const gr = lg.createRadialGradient(x, y, 0, x, y, 75);
    gr.addColorStop(0, 'rgba(0,0,0,.9)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    lg.fillStyle = gr; lg.fillRect(x - 75, y - 75, 150, 150);
  }
  if (game) {
    cone(lg, px, PLAYER_Y - PH / 2 + 2, 190, 11, 55, 0.95);
    for (const c of traffic) {
      const y = screenY(c.D, dist);
      if (y < -120 || y > H + 200) continue;
      if (c.oncoming) cone(lg, carX(c.lane, c.D, dist), y + c.h / 2 - 2, 145, 9, 44, 0.85, 1);
      else cone(lg, carX(c.lane, c.D, dist), y - c.h / 2 + 2, 120, 9, 38, 0.7);
    }
  }
  ctx.drawImage(lightC, 0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  const warm = glowSprite('#ffcf70'), red = glowSprite('#ff3030'), blue = glowSprite('#2d7bff'), white = glowSprite('#fff6d0');
  for (const [x, y] of lamps) { ctx.globalAlpha = a * 0.8; blit(warm, x, y, 0, 0.7); }
  if (game) {
    for (const c of traffic) {
      const x = carX(c.lane, c.D, dist), y = screenY(c.D, dist);
      if (y < -60 || y > H + 60) continue;
      if (c.oncoming) {
        ctx.globalAlpha = a * 0.95;
        blit(white, x - c.w / 2 + 5, y + c.h / 2 - 2, 0, 0.42); blit(white, x + c.w / 2 - 5, y + c.h / 2 - 2, 0, 0.42);
      } else {
        ctx.globalAlpha = a * 0.75;
        blit(red, x - c.w / 2 + 5, y + c.h / 2 - 2, 0, 0.35); blit(red, x + c.w / 2 - 5, y + c.h / 2 - 2, 0, 0.35);
      }
      if (c.type === 'police') { ctx.globalAlpha = a; blit(Math.floor(t * 6) % 2 ? red : blue, x, y, 0, 0.9); }
    }
    ctx.globalAlpha = a * 0.9;
    blit(white, px - 8, PLAYER_Y - PH / 2 + 2, 0, 0.35); blit(white, px + 8, PLAYER_Y - PH / 2 + 2, 0, 0.35);
    const cs = glowSprite('#ffd60a');
    for (const c of coins) { const y = screenY(c.D, dist); if (y > -20 && y < H + 20) { ctx.globalAlpha = a * 0.5; blit(cs, carX(c.lane, c.D, dist), y, 0, 0.6); } }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawFinishLine(vd) {
  if (!activeStage || (state !== 'play' && state !== 'paused' && state !== 'stageOver')) return;
  const finishD = activeStage.length * 50;
  const fy = screenY(finishD, vd);
  if (fy < -90 || fy > H + 90) return;
  const fx = W / 2 + curve(finishD) - curve(vd);
  const cols = 12, sqW = (HALF * 2) / cols, sqH = 10;
  for (let r = 0; r < 2; r++) {
    for (let c = 0; c < cols; c++) {
      ctx.fillStyle = (r + c) % 2 === 0 ? '#ffffff' : '#181a20';
      ctx.fillRect(fx - HALF + c * sqW, fy - sqH + r * sqH, sqW + 0.5, sqH + 0.5);
    }
  }
  for (const s of [-1, 1]) {
    const px0 = fx + s * (HALF + 10);
    ctx.fillStyle = '#e63946'; ctx.fillRect(px0 - 3, fy - 34, 6, 36);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(px0 - 3, fy - 24, 6, 9);
    drawFlag(px0 + (s < 0 ? 5 : -5), fy - 38, 11);
  }
}

function drawWorld(vd, game) {
  drawGround(vd);
  drawRoad(vd);
  drawFinishLine(vd);
  drawDecor(vd);
  if (game) { drawObjects(); if (nitro > 0) drawSpeedLines(); drawPlayer(); }
  drawParts();
  const w = biomeWeights(vd);
  drawClouds(vd, w[0] + w[1]);
  drawSnow(w[2]);
  drawNight(w[3], game);
  ctx.drawImage(vignette, 0, 0, W, H);
}

// ---------- drawing: HUD / screens ----------
function button(x, y, w, h, label, c1, c2, fn, size) {
  const pressed = pressedAt && pressedAt.x >= x - w / 2 && pressedAt.x <= x + w / 2 && pressedAt.y >= y - h / 2 && pressedAt.y <= y + h / 2;
  const dy = pressed ? 4 : 0;
  ctx.fillStyle = 'rgba(0,0,0,.3)'; rr(x - w / 2 + 2, y - h / 2 + 9, w, h, 18); ctx.fill();
  ctx.fillStyle = c2; rr(x - w / 2, y - h / 2 + 6, w, h, 18); ctx.fill();
  const g = ctx.createLinearGradient(0, y - h / 2 + dy, 0, y + h / 2 + dy);
  g.addColorStop(0, shade(c1, 0.18)); g.addColorStop(1, c1);
  ctx.fillStyle = g; rr(x - w / 2, y - h / 2 + dy, w, h, 18); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.22)'; rr(x - w / 2 + 6, y - h / 2 + 4 + dy, w - 12, h * 0.36, 12); ctx.fill();
  text(label, x, y + 2 + dy, size || 26, '#fff', { w: 5, c: 'rgba(0,0,0,.3)' });
  ui.push({ x: x - w / 2, y: y - h / 2, w, h, fn });
}
function pill(x, y, w, h) { ctx.fillStyle = 'rgba(10,16,30,.45)'; rr(x, y, w, h, h / 2); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 1.5; ctx.stroke(); }

function drawSpeedometer() {
  const kmh = Math.round(speed * SPEED_FACTOR);
  const maxKmh = 200;
  const frac = clamp(kmh / maxKmh, 0, 1);
  const cx = W - 46, cy = H - 45, R = 33;
  const isTurbo = nitro > 0;
  ctx.fillStyle = 'rgba(10,16,30,.68)';
  circle(ctx, cx, cy, R + 3); ctx.fill();
  ctx.lineWidth = isTurbo ? 2.5 : 1.5;
  ctx.strokeStyle = isTurbo ? '#00f5d4' : 'rgba(255,255,255,.2)';
  ctx.stroke();

  const a0 = Math.PI * 0.78, a1 = Math.PI * 2.22, span = a1 - a0;
  const ang = a0 + frac * span;
  ctx.lineCap = 'round';
  ctx.lineWidth = 5.5;
  ctx.strokeStyle = 'rgba(255,255,255,.14)';
  ctx.beginPath(); ctx.arc(cx, cy, R - 5, a0, a1); ctx.stroke();

  if (frac > 0.01) {
    ctx.strokeStyle = isTurbo ? '#00f5d4' : (kmh >= 125 ? '#ff9f1c' : '#4cc9f0');
    ctx.beginPath(); ctx.arc(cx, cy, R - 5, a0, ang); ctx.stroke();
  }
  ctx.lineCap = 'butt';

  for (let i = 0; i <= 4; i++) {
    const ta = a0 + (i / 4) * span;
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(ta) * (R - 10), cy + Math.sin(ta) * (R - 10));
    ctx.lineTo(cx + Math.cos(ta) * (R - 2), cy + Math.sin(ta) * (R - 2));
    ctx.stroke();
  }

  ctx.strokeStyle = isTurbo ? '#ffd60a' : '#ff4d6d'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(ang) * (R - 8), cy + Math.sin(ang) * (R - 8));
  ctx.stroke(); ctx.lineCap = 'butt';
  ctx.fillStyle = '#fff'; circle(ctx, cx, cy, 3.2); ctx.fill();

  text(String(kmh), cx, cy + 9, 16, isTurbo ? '#00f5d4' : '#ffffff');
  text('קמ"ש', cx, cy + 22, 11, '#a8c0d6');
}

function drawJourneyProgress() {
  const finishD = activeStage.length * 50;
  const prog = clamp(dist / finishD, 0, 1);
  pill(104, 10, 162, 38);
  const x0 = 117, x1 = 236, ty = 19;
  ctx.lineCap = 'round'; ctx.lineWidth = 5;
  ctx.strokeStyle = 'rgba(255,255,255,.18)';
  ctx.beginPath(); ctx.moveTo(x0, ty); ctx.lineTo(x1, ty); ctx.stroke();
  if (prog > 0.01) {
    ctx.strokeStyle = WORLDS[activeStage.world].accent;
    ctx.beginPath(); ctx.moveTo(x0, ty); ctx.lineTo(x0 + prog * (x1 - x0), ty); ctx.stroke();
  }
  ctx.lineCap = 'butt';
  drawFlag(249, ty, 8.5);
  const dx = x0 + prog * (x1 - x0);
  ctx.fillStyle = '#ffffff'; circle(ctx, dx, ty, 5); ctx.fill();
  ctx.fillStyle = '#ffd60a'; circle(ctx, dx, ty, 3); ctx.fill();
  const curM = Math.min(activeStage.length, Math.floor(dist / 50));
  text(curM + ' / ' + activeStage.length + ' מ׳', 185, 36, 12, '#d7e5f5');
}

function drawHud() {
  pill(8, 10, 92, 34);
  for (let i = 0; i < maxLives; i++) {
    if (i < lives) heart(28 + i * 26, 27, 8.5, '#ff4d6d', '#ffffff');
    else heart(28 + i * 26, 27, 8.5, 'rgba(0,0,0,.35)', 'rgba(255,255,255,.35)');
  }
  if (activeStage) {
    drawJourneyProgress();
  } else {
    const sc = Math.floor(dist / 50) + coinsRun * 10 + smashes * 25;
    pill(W / 2 - 52, 8, 104, 40);
    text(String(sc), W / 2, 29, 28, '#fff');
  }
  pill(W - 92, 10, 84, 34);
  blit(coinSprite(), W - 72, 27, 0, 0.85);
  text(String(coinsRun), W - 56, 28, 22, '#ffe066', null, 'left');
  if (nitro > 0) {
    ctx.fillStyle = 'rgba(0,0,0,.45)'; rr(W / 2 - 70, H - 36, 140, 14, 7); ctx.fill();
    const g = ctx.createLinearGradient(W / 2 - 70, 0, W / 2 + 70, 0);
    g.addColorStop(0, '#4cc9f0'); g.addColorStop(1, '#ffd60a');
    ctx.fillStyle = g; rr(W / 2 - 70, H - 36, 140 * (nitro / 3.2), 14, 7); ctx.fill();
  }
  drawSpeedometer();
  if (popup) {
    const k = 1.8 - popup.life;
    ctx.globalAlpha = clamp(popup.life * 2, 0, 1);
    const sc2 = 1 + Math.max(0, 0.25 - k) * 2;
    ctx.save(); ctx.translate(W / 2, 96 - k * 8); ctx.scale(sc2, sc2);
    text(popup.s, 0, 0, 34, '#ffd60a', { w: 7, c: 'rgba(0,0,0,.55)' });
    ctx.restore();
    if (popup.sub) text(popup.sub, W / 2, 130 - k * 8, 18, '#ffffff', OUT);
    ctx.globalAlpha = 1;
  }
  if (flash > 0) { ctx.fillStyle = 'rgba(255,40,60,' + (flash * 1.4) + ')'; ctx.fillRect(0, 0, W, H); }
}

function drawCountdown() {
  if (countdown > 0) {
    const c = Math.ceil(countdown), f = countdown - Math.floor(countdown);
    ctx.save(); ctx.translate(W / 2, H * 0.36); ctx.scale(1 + f * 0.5, 1 + f * 0.5);
    ctx.globalAlpha = clamp(0.4 + f, 0, 1);
    const g = ctx.createLinearGradient(0, -50, 0, 50); g.addColorStop(0, '#fff3a0'); g.addColorStop(1, '#ff9f1c');
    text(String(c), 0, 0, 120, g, { w: 12, c: 'rgba(60,20,0,.6)' });
    ctx.restore(); ctx.globalAlpha = 1;
    text('גוררים עם האצבע כדי לנהוג', W / 2, H * 0.36 + 96, 19, '#fff', OUT);
  } else if (goFlash > 0) {

function drawMap() {

  const top = 62, bottom = H - (mapMsg > 0 ? 36 : 12);

  for (let w = 0; w < 4; w++) {

    ctx.fillStyle = g; rr(x0, y0, cw, ch, 16); ctx.fill();

    ctx.stroke();

    // World title + star count
    text((w + 1) + '. ' + world.name, x0 + cw - 12, y0 + 18, 16, worldOpen ? '#fff' : '#8b9bb4', OUT, 'right');
    drawStar(x0 + 22, y0 + 18, 6.8, '#ffd60a', '#6b3800');
    text(worldStarsTotal(w) + '/15', x0 + 34, y0 + 19, 13, '#ffe066', null, 'left');

      ctx.fillStyle = 'rgba(0,0,0,.45)'; rr(x0 + 82, y0 + 7, 122, 21, 10); ctx.fill();
      text('צריך 8 כוכבים', x0 + 143, y0 + 18, 12, '#ffd60a');

    const ty0 = y0 + 30 + (ch - 34 - th) / 2;
    const lineY = ty0 + th / 2;
    ctx.strokeStyle = worldOpen ? 'rgba(255,255,255,.22)' : 'rgba(255,255,255,.08)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x0 + 12 + tw / 2, lineY); ctx.lineTo(x0 + cw - 12 - tw / 2, lineY); ctx.stroke();

    for (let s = 0; s < 5; s++) {
      const idx = w * 5 + s, open = isStageUnlocked(w, s), stars = save.stars[idx] || 0, isBoss = s === 4;
      const tx0 = x0 + cw - 12 - tw - s * stepX, cx = tx0 + tw / 2, cy = ty0 + th / 2;
      const pulse = open && stars === 0 ? 0.5 + 0.5 * Math.sin(t * 4 + s) : 0;

      if (open) {
        const tg = ctx.createLinearGradient(0, ty0, 0, ty0 + th);
        tg.addColorStop(0, stars > 0 ? shade(world.c1, 0.25) : (isBoss ? '#d97706' : '#334e7d'));
        tg.addColorStop(1, stars > 0 ? world.c2 : (isBoss ? '#7c2d12' : '#1b2b48'));
        ctx.fillStyle = tg;

        ctx.fillStyle = 'rgba(10,14,26,.78)';

      rr(tx0, ty0, tw, th, 12); ctx.fill();
      ctx.lineWidth = open ? (stars > 0 ? 2 : 2 + pulse) : 1.2;
      ctx.strokeStyle = open ? (isBoss ? '#ffd60a' : (stars > 0 ? world.accent : '#ffffff')) : 'rgba(255,255,255,.16)';
      ctx.stroke();

      if (!open) {
        drawLock(cx, cy - (isBoss && worldOpen ? 10 : 4), 8.5, isBoss ? '#ffd60a' : '#7f91ab');
        if (isBoss && worldOpen && w14 < BOSS_REQ_STARS) {
          text(w14 + '/8', cx, cy + 12, 12, '#ffd60a');

      } else {
        if (isBoss) drawCrown(cx, cy - 10, 9.5, '#ffd60a', '#6b3800');

        audioInit();
        if (open) { blip(660, 880, 0.08, 'square', 0.05); openStageCard(idx); }
        else {
          blip(180, 120, 0.15, 'square', 0.05); buzz(40);
          mapMsg = 1.8;

        }

    }

    if (!worldOpen) {
      ctx.fillStyle = 'rgba(6,10,20,.45)'; rr(x0, y0, cw, ch, 16); ctx.fill();
    }
  }

  if (mapMsg > 0) {

  ctx.restore(); ctx.globalAlpha = 1;
  if (overT > 0.7) {
    button(cx, cy + 92, 224, 56, 'שחק שוב', '#2dbd5a', '#17803a', startFreeRun, 26);
    button(cx, cy + 156, 224, 46, 'תפריט', '#6c757d', '#41474d', () => { state = 'menu'; demoDist = dist; }, 22);
  }
}

function drawConfetti() {
  for (const c of confetti) {
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r);
    ctx.fillStyle = c.c; ctx.fillRect(-c.s / 2, -c.s / 4, c.s, c.s / 2);
    ctx.restore();
  }
}

function render() {
  ctx.fillStyle = '#0d150d'; ctx.fillRect(0, 0, W, H);
  if (state === 'menu') return drawMenu();
  if (state === 'map') return drawMap();
  if (state === 'stageCard') return drawStageCard();
  if (state === 'garage') return drawGarage();
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 22, (Math.random() - 0.5) * shake * 22);
  drawWorld(dist, true);
  ctx.restore();
  if (state === 'over') { drawOver(); drawConfetti(); return; }
  if (state === 'stageOver') { drawStageOver(); drawConfetti(); return; }
  drawHud();
  drawCountdown();
  if (state === 'paused') {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H);
    text('הפסקה', W / 2, H * 0.4, 54, '#fff', OUT);
    text('לוחצים כדי להמשיך', W / 2, H * 0.4 + 54, 21, '#ffd60a', OUT);
    button(W / 2, H * 0.4 + 122, 180, 48, activeStage ? 'חזרה למפה' : 'תפריט', '#6c757d', '#41474d', () => {
      engineSet(false, 0);
      state = activeStage ? 'map' : 'menu';
    }, 20);
  }
}

// ---------- input ----------
let dragId = null, lastX = 0, pressedAt = null;
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  audioInit();
  const p = toLogical(e);
  if (state === 'paused') {
    for (let i = ui.length - 1; i >= 0; i--) {
      const b = ui[i];
      if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { b.fn(); return; }
    }
    state = 'play'; countdown = 1.2; lastTick = 2; return;
  }
  if (state === 'play') { dragId = e.pointerId; lastX = p.x; try { cv.setPointerCapture(e.pointerId); } catch (err) {} }
  else pressedAt = p;
});
cv.addEventListener('pointermove', e => {
  if (state !== 'play' || e.pointerId !== dragId) return;
  const p = toLogical(e);
  tx = clamp(tx + (p.x - lastX) * 1.5, 16, W - 16);
  lastX = p.x;
});
cv.addEventListener('pointerup', e => {
  pressedAt = null;
  if (e.pointerId === dragId) dragId = null;
  if (state === 'play' || state === 'paused') return;
  const p = toLogical(e);
  for (let i = ui.length - 1; i >= 0; i--) {
    const b = ui[i];
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { b.fn(); break; }
  }
});
cv.addEventListener('pointercancel', e => { pressedAt = null; if (e.pointerId === dragId) dragId = null; });
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  else if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  else if (e.key === ' ' || e.key === 'Enter') {
    if (state === 'menu') state = 'map';
    else if (state === 'over' && overT > 0.7) startFreeRun();
    else if (state === 'stageCard') startStage(selectedStage);
    else if (state === 'stageOver' && overT > 0.55) startStage(selectedStage);
  } else if (e.key === 'Escape') {
    if (state === 'play') state = 'paused';
    else if (state === 'stageCard') state = 'map';
    else if (state === 'map' || state === 'garage') state = 'menu';
  }
  audioInit();
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  else if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (state === 'play') state = 'paused'; engineSet(false, 0); }
});

// ---------- loop ----------
let last = performance.now();
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000) || 0.016;
  last = ts;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  ui = [];
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// test hooks for headless verification
window.__g = {
  set(s) {
    state = s;
    if (s === 'over') { activeStage = null; dist = 4200; coinsRun = 7; score = 118; newBest = true; overT = 1; }
    else if (s === 'stageCard') { activeStage = STAGES[selectedStage || 0]; }
    else if (s === 'stageOver') {
      activeStage = STAGES[selectedStage || 0]; overT = 1;
      if (!goalResults.length) { stageFailed = false; goalResults = [true, true, false]; earnedStars = 2; starBonus = 40; }
    }
    else if (s === 'menu' || s === 'garage') { activeStage = null; }
  },
  warp(m) {
    dist = m * 50; demoDist = dist;
    nextRow = dist + 400; nextCoin = dist + 500; nextBolt = dist + 600;
    nextHazard = dist + 500; nextNarrow = dist + 900; nextOncoming = dist + 700;
    traffic = []; coins = []; bolts = []; hazards = []; narrows = [];
    iceT = 0; vxIce = 0;
    lastBiome = biomeAt(dist); nextMilestone = Math.ceil(m / 250) * 250 + 250;
  },
  stage(w, s) {
    const wi = clamp(w | 0, 0, 3), si = clamp(s | 0, 0, 4);
    startStage(wi * 5 + si);
  },
  finish() {
    if (!activeStage) return false;
    countdown = 0;
    dist = activeStage.length * 50 + 2;
    finishStage();
    return true;
  },
  mech() { return activeMechs(); },
  spawn(kind) {
    const norm = kind === 'pothole' ? 'potholes'
      : kind === 'cone' ? 'cones'
      : kind === 'sharpCurve' ? 'sharpCurves'
      : kind;
    if (!norm) return false;
    if (!forcedMechs.includes(norm)) forcedMechs.push(norm);
    if (norm === 'sharpCurves') {
      forcedSharpD = dist;
      return true;
    }
    if (norm === 'narrow') {
      const D = dist + 440;
      const side = hasMech('oncoming') ? 1 : (Math.random() < 0.5 ? -1 : 1);
      const closed = side < 0 ? 0 : 3;
      narrows.push({ D0: D, D1: D + 900, side });
      traffic = traffic.filter(c => !(Math.round(c.lane) === closed && c.D >= D - 200 && c.D <= D + 1100));
      coins = coins.filter(c => !(c.lane === closed && c.D >= D - 160 && c.D <= D + 1060));
      prevFree = usableLanesAt(D, 200);
      return true;
    }
    if (norm === 'laneChange') {
      const D = dist + 460;
      const lane = hasMech('oncoming') ? 2 : 1;
      const shiftDir = lane <= (hasMech('oncoming') ? 1 : 0) ? 1 : -1;
      const color = TRAFFIC_COLORS[0];
      traffic.push({
        lane, D, type: 'sedan', w: PW, h: PH, color,
        spr: vehicleSprite('sedan', color, null), rot: 0,
        shiftDir, fromLane: lane, targetLane: lane + shiftDir,
        blinkT: 0.85, moveT: 0, triggered: true
      });
      return true;
    }
    if (norm === 'oncoming') {
      const D = dist + 460;
      if (!spawnOncoming(D)) {
        const color = TRAFFIC_COLORS[1];
        traffic.push({ lane: 0, D, type: 'sedan', w: PW, h: PH, color, spr: vehicleSprite('sedan', color, null), oncoming: true, rot: 0 });
      }
      return true;
    }
    if (norm === 'sand' || norm === 'ice' || norm === 'cones' || norm === 'potholes') {
      const D = dist + 400;
      spawnHazard(norm === 'potholes' ? 'pothole' : norm, D, hasMech('oncoming') ? 2 : 1);
      return true;
    }
    return false;
  },
  unlockAll() { unlockedAll = true; },
  get save() { return save; },
  get state() { return state; },
  get stages() { return STAGES; },
  get speedKmh() { return Math.round(speed * SPEED_FACTOR); },
};
})();
</script>
</body>
</html>
